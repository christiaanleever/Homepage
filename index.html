<!DOCTYPE html>
<html lang="en">
<head>

<title>Beyond the River | Feature Backlog Overview</title>
<style>
:root{--bg:#0e1515;--panel:#172321;--panel2:#1b2926;--border:#30413d;--text:#eef3ed;--muted:#9eaaa4;--accent:#d6b36a;--backlog:#7f8a86;--ready:#5b9fe3;--developing:#d75d5d;--playtesting:#e59b4b;--complete:#56b878;--empty:#43524e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 0%,#1d3029 0,#0e1515 40%);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif;font-size:13px;line-height:1.4}
button,input{font:inherit}
.shell{max-width:1500px;margin:auto;padding:22px 22px 44px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:24px}.subtitle{color:var(--muted);font-size:11px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{min-width:260px;flex:1 1 280px;max-width:480px;background:#13201e;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;outline:none}
.search:focus{border-color:#6e817a;box-shadow:0 0 0 2px rgba(110,129,122,.18)}
.filters,.stats{display:flex;gap:6px;flex-wrap:wrap}.filters{margin-bottom:10px}.stats{margin-bottom:14px}
.filter,.stat,.badge,.expand-all{border-radius:999px;border:1px solid var(--border);background:#13201e;color:var(--muted)}
.filter,.expand-all{padding:5px 9px;cursor:pointer}.filter.active,.expand-all:hover{color:#fff;border-color:#6e817a;background:#263633}
.stat{padding:5px 8px}.stat b{color:#fff}
.overall{padding:15px 18px;margin:0 0 17px;border:1px solid #526258;border-radius:12px;background:linear-gradient(180deg,#1b2c28,#15221f)}
.overall-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.overall-title{font-size:15px;font-weight:800;color:#f0f4ed}.overall-scope{font-size:11px;color:var(--muted);margin-top:2px}
.overall-totals{font-size:16px;font-weight:800;color:#f5ebcf;font-variant-numeric:tabular-nums}
.overall-bar{height:20px;display:flex;overflow:hidden;width:100%;border-radius:6px;margin:13px 0 11px;background:#33433e}
.overall-bar .seg{height:100%;min-width:0}
.overall-bar .seg.Retired{background:var(--retired)}.overall-bar .seg.BugOpen{background:var(--bugopen)}.overall-bar .seg.BugRepro{background:var(--bugrepro)}.overall-bar .seg.BugResolved{background:var(--bugresolved)}.overall-bar .seg.BugWontFix{background:var(--bugwontfix)}
.overall-breakdown{display:flex;flex-wrap:wrap;gap:7px 15px}
.overall-item{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:#d2dcd6}.overall-item b{font-size:12px;color:#fff;font-variant-numeric:tabular-nums}
.overall-item .legend-dot{width:9px;height:9px;border-radius:2px}
@media(max-width:680px){.overall{padding:13px}.overall-totals{font-size:14px}.overall-bar{height:18px}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.feature{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.feature-head{width:100%;display:block;text-align:left;background:transparent;color:inherit;border:0;padding:10px 11px;cursor:pointer}
.feature-head:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.feature-top{display:flex;gap:8px;align-items:center;min-width:0}
.fid{color:var(--accent);font-weight:800;flex:none}.feature-title{font-weight:750;min-width:0}.feature-count{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}
.chevron{width:13px;display:inline-block;text-align:center;color:var(--muted);transition:transform .15s ease;flex:none}.feature.open .chevron{transform:rotate(90deg)}
.progress{height:6px;background:var(--empty);border-radius:999px;overflow:hidden;display:flex;margin-top:8px}.progress.empty{background:#273431;border:1px solid #3b4a46}
.seg{height:100%}.seg.Backlog{background:var(--backlog)}.seg.Ready{background:var(--ready)}.seg.Developing{background:var(--developing)}.seg.Playtesting{background:var(--playtesting)}.seg.Complete{background:var(--complete)}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px;min-height:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--empty);cursor:help}.dot.Backlog{background:var(--backlog)}.dot.Ready{background:var(--ready)}.dot.Developing{background:var(--developing)}.dot.Playtesting{background:var(--playtesting)}.dot.Complete{background:var(--complete)}
.no-stories{color:var(--muted);font-size:10px;margin-top:6px}
.feature-body{border-top:1px solid var(--border);padding:8px 6px 6px}.feature-desc{color:#c4d0ca;font-size:11px;padding:2px 6px 7px}
.stories{list-style:none;padding:0;margin:0}.story{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;padding:6px;border-radius:7px;cursor:help}.story:hover{background:#22322f}
.sid{color:#879892;font-size:9.5px;font-weight:700;margin-right:5px}.story-name{font-size:11.5px}
.badge{padding:2px 6px;font-size:9.5px;font-weight:700}.badge.Backlog{color:#c8cfcc;border-color:#59635f;background:#2b3330}.badge.Ready{color:#a9d4ff;border-color:#3b6387;background:#1d3042}.badge.Developing{color:#ffaaaa;border-color:#753d3d;background:#392525}.badge.Playtesting{color:#ffd29a;border-color:#8b5a24;background:#402d19}.badge.Complete{color:#9cddb1;border-color:#3d7652;background:#1e3928}
.legend{display:flex;gap:9px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:10px;margin:-5px 0 12px}.legend-item{display:flex;align-items:center;gap:4px}.legend-dot{width:7px;height:7px;border-radius:50%}
.tooltip{position:fixed;display:none;z-index:99;width:min(520px,calc(100vw - 24px));background:#f5f0df;color:#26302c;border:1px solid #cbbf9e;border-radius:9px;padding:10px 12px;box-shadow:0 15px 45px rgba(0,0,0,.42);pointer-events:none}.tooltip.show{display:block}.tooltip b{display:block;margin-bottom:5px}.tooltip small{display:block;margin-top:6px;color:#796f58;text-transform:uppercase;font-weight:800;letter-spacing:.6px}
.empty-state{grid-column:1/-1;color:var(--muted);padding:18px;border:1px dashed var(--border);border-radius:10px;text-align:center}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.shell{padding:14px 10px 32px}.grid{grid-template-columns:1fr}.search{min-width:100%;max-width:none}}
@media(prefers-reduced-motion:reduce){.chevron{transition:none}}

:root{--retired:#95839f;--bugopen:#e7b37a;--bugrepro:#7cc5d4;--bugresolved:#aabbd6;--bugwontfix:#c2a1c9}
.dot.Retired{background:var(--retired)}.badge.Retired{color:#ccbcd4;border-color:#776480;background:#302738}
.badge.BugOpen{color:#f3c391;border-color:#9b744d;background:#34291d}.badge.BugRepro{color:#a4e0ed;border-color:#528594;background:#20343c}.badge.BugResolved{color:#c0d0e7;border-color:#74839b;background:#26313f}.badge.BugWontFix{color:#dfbce5;border-color:#8c6894;background:#35273a}
.filter-label{align-self:center;color:var(--muted);font-size:10px;margin:0 2px 0 5px}.bug-register{margin-top:22px}.bug-register h2{font-size:18px;margin:0 0 6px}.register-note{color:var(--muted);font-size:11px;margin:0 0 12px}.bug-detail{padding:4px 6px;color:#c4d0ca;font-size:11px;overflow-wrap:anywhere}.bug-detail a{color:#a9d4ff}.feature-count{text-align:right;white-space:normal}.bug-card .feature-top{flex-wrap:wrap}.bug-card .badge{margin-left:auto}.tooltip{max-height:calc(100vh - 24px);overflow:hidden}
[hidden]{display:none!important}
</style>
</head>

<script>
const FEATURES=[{"id":"F01","title":"Gameplay Feel & Responsiveness","description":"Make direct control feel immediate, predictable and pleasant while keeping collision and traversal readable.","stories":[{"id":"F01-US01","title":"Immediate WASD Movement","status":"Complete","summary":"Immediate start/stop/direction changes are accepted."},{"id":"F01-US02","title":"Tune Base Movement Speed","status":"Complete","summary":"200 px/s remains the accepted normal-game baseline. Temporary playtest infrastructure now selects 1.0x, 2.0x or 4.0x for 200, 400 or 800 px/s, defaulting to 200 px/s from 13 October 2026."},{"id":"F01-US03","title":"Consistent Right-Click Movement","status":"Complete","summary":"Right-click movement matches direct movement appropriately; WASD cancels it immediately; marker-free presentation is accepted."},{"id":"F01-US04","title":"Responsive Camera Follow","status":"Complete","summary":"Tight, unsmoothed camera response is accepted for the POC."},{"id":"F01-US05","title":"Solid Collision Feel","status":"Complete","summary":"Trees, rocks and current structures block where expected with appropriately compact grounded footprints."},{"id":"F01-US06","title":"Clear Walkable vs Non-Walkable Areas","status":"Complete","summary":"Basic walkability and solid-object readability are accepted. Shallow-water immersion is tracked separately."},{"id":"F01-US07","title":"Stable Frame Rate Baseline","status":"Complete","summary":"The earlier representative visual slice felt smooth in normal play. The later full-map ecology pass has variable synthetic frame samples, so release/performance validation remains a future concern rather than reopening this basic POC story."},{"id":"F01-US08","title":"Input Responsiveness Test Pass","status":"Complete","summary":"Start/stop/reverse/diagonal/obstacle/click-interruption behaviour is accepted."},{"id":"F01-US09","title":"Terrain-Based Movement Speed","status":"Complete","summary":"The 0.70 shallow-water multiplier is accepted and applies to the currently selected playtest speed: 140, 280 or 560 px/s shallow versus 200, 400 or 800 px/s dry. Other terrain categories remain future work."},{"id":"F01-US10","title":"Temporary Fast POC Testing Speed","status":"Complete","summary":"The temporary screen-anchored developer selector offers Half, Normal and Double relative to the familiar 400 px/s POC speed: 200, 400 and 800 px/s, with Half speed (200 px/s) selected at launch from 13 October 2026; the panel is now opened through Developer. It exists only for traversal and collision playtesting and must not be mistaken for release UI or release feel. The intended normal-game baseline remains approximately 200 px/s. A later release design may test normal movement near 200 px/s, sprint near 400 px/s and cautious movement near 100 px/s, but keys, stamina, animation and final tiers are not approved here."},{"id":"F01-US11","title":"Allow Right-Click Attempts Into Dangerous Water","status":"Complete","summary":"Quick and held right-click attempts may enter deep water rather than being rejected at input time. A temporary dev_allow_deep_water_exploration override currently suppresses drowning for world inspection while retaining the underlying drowning flow. WASD may also cross in this developer mode. Movement may jitter while traversing deep water with the override enabled; that is an accepted/deferred developer-mode issue, not release behaviour. Do not address it in the accepted environment/movement checkpoint. TEMPORARY DEEP-WATER DEVELOPER EXPLORATION OVERRIDE MUST BE DISABLED BEFORE RELEASE-FACING GAMEPLAY VALIDATION."},{"id":"F01-US12","title":"Assisted WASD Obstacle Navigation","status":"Complete","summary":"Direct WASD adds a small local tangent deflection when an obstacle blocks the requested direction, choosing the nearby side with brief persistence. It remains immediate direct control, not pathfinding, and is human-accepted at 200, 400 and 800 px/s for the POC."},{"id":"F01-US13","title":"Right-Click Approach to Blocked Destinations","status":"Complete","summary":"Blocked objects are approached to a sensible reachable point without auto-interaction."},{"id":"F01-US14","title":"Fallen Log Collision Fit","status":"Complete","summary":"As a player, I want fallen logs to block where their visible trunk actually is so that I do not partially walk through them or collide with an unintuitive box. Current observation, 14 September 2026 The accepted correction keeps an elongated diagonal trunk footprint, shifts it 10 px downward and excludes surrounding foliage. Physics and human traversal checks confirm the visible trunk blocks without a foliage-sized obstacle."},{"id":"F01-US15","title":"Dense-Environment WASD Traversal Friction Review","status":"Complete","summary":"As a player, I want dense natural areas to remain pleasant to traverse with direct WASD control so that environmental richness does not become repeated obstacle frustration. Intent Do not judge this primarily at the temporary 400 px/s test speed and wide developer zoom. Re-evaluate at the intended 200 px/s normal movement and likely closer release camera before changing tree density/collision. Preserve environmental richness unless normal-speed play demonstrates a real problem. Potential later solutions may include footprint tuning, local composition changes or improved sliding, not automatically removing collision. Current observation, 14 September 2026 The accepted correction adds bounded local collision deflection and fitted root bases without changing resource counts. Automated and human playtests cover 200, 400 and 800 px/s. Release feel at a closer camera remains separate future work under F02-US17."},{"id":"F01-US16","title":"Continuous Right-Button Hold-to-Move","status":"Complete","summary":"As a player, I want holding the right mouse button to keep steering the Wanderer toward the cursor so that mouse movement can feel continuous and responsive. The selector, quick click, 0.18-second hold transition, continuous steering and WASD cancellation are human-approved. Speed-aware path-point acceptance at 800 px/s and unchanged-target handling prevent route restarts. Deep-water traversal may still jitter while the temporary developer override is enabled; this is deferred, not accepted release behaviour."},{"id":"F01-US17","title":"Scale Harvesting Cadence with Developer Speed Controls","status":"Complete","summary":"As a developer/playtester, I want the temporary Half, Normal and Double developer speed controls to scale chopping and mining cadence as well as movement so that harvesting pacing can be tested quickly at slower and faster speeds. Intent Half speed should approximately double the time between harvesting impacts. Normal speed should preserve the existing harvesting cadence. Double speed should approximately halve the time between harvesting impacts. Apply the multiplier to both tree chopping and rock mining. Do not change the required number of impacts, resource rewards, tool harvesting strength or normal-speed gameplay balance. Keep this as a developer/playtesting aid, not release UI or approved release pacing. The separate possibility that future better tools could also swing faster is a speculative progression idea and is not part of this story. Implementation and validation, 9 October 2026 Half/Normal/Double scale the harvesting clock by 0.5/1/2 relative to the existing Normal..."}]},{"id":"F02","title":"Visual Art Direction & World Readability","description":"Move the game toward the warm, organic Concept A / North Star visual family with a reusable mid-resolution pixel-art production language.","stories":[{"id":"F02-US01","title":"Establish Concept A Visual Baseline","status":"Complete","summary":"Concept A / North Star visual baseline is accepted for the current POC, including the accepted F18 shoreline and water work. Optional vegetation motion remains desirable under F03-US12; improved splash artwork is future polish under F03-US27. Final art, unfinished placeholder/landmark refinements and release-quality polish are not automatically accepted by this closure."},{"id":"F02-US02","title":"Improve Grass and Ground","status":"Complete","summary":"The accepted grass/ground language and Nature Dressing overlays now cover the starting island and visible opposite banks. A single under-dressed central field is accepted as minor POC polish and tracked under F02-US18 rather than keeping this broad story open."},{"id":"F02-US03","title":"Create Organic Shorelines","status":"Complete","summary":"Organic shorelines and the four-family river-edge language are accepted for the POC through F18. Natural transitions, land-overlay grounding and varied shore composition satisfy this visual-readability tracker. Deferred cliff-art refinements remain recorded under F18 without reopening its accepted implementation stories."},{"id":"F02-US04","title":"Tree Visual Variety","status":"Complete","summary":"Four accepted normal production tree variants are clearly distinct at gameplay distance."},{"id":"F02-US05","title":"Rock Visual Variety","status":"Complete","summary":"Three accepted production rock variants are clearly distinct. Depleted states remain separate work."},{"id":"F02-US06","title":"Establish the Intended Starting-Island Visual","status":"Backlog","summary":"Further starting-island composition review is deferred until crafting, building and discovery design. The natural/ecological composition is accepted for the POC; final island composition remains open. Deferred observations Some cliff artwork could still improve; F18 already records deferred cliff-art refinements without reopening its accepted stories. The inaccessible ordinary oak Tree08 near the Hero Tree was identified from Christiaan's screenshots and removed under BUG-005 (formerly F03-US28). Christiaan human-accepted Tree08 removal on 16 October 2026; BUG-005 is Resolved. One or two additional plant sprites may improve variation. Potential decorative young trees/saplings belong with future forestry design under F08-US02. Hidden discoveries belong under F05-US08 and related F05 stories, not duplicated here. Local POC cleanup, 9 October 2026: Removed the chest-obscuring rightmost broadleaf instance ProductionD10 and obsolete RuinBackWall / RuinLeftWall placeholders with their collision. The two companion trees, shared..."},{"id":"F02-US07","title":"Object Grounding and Contact Shadows","status":"Complete","summary":"Future art-direction note, F18 acceptance 8 October 2026: consistent daylight direction and environmental grounding remain later refinement, aligned with F13 day/night work. No new lighting system is part of completed F18."},{"id":"F02-US08","title":"Correct Top-Down Depth Sorting","status":"Complete","summary":""},{"id":"F02-US09","title":"Tree Canopy Occlusion","status":"Complete","summary":"Hover brightening and occlusion alpha combine without blinking. Accepted fading samples actual tree sprite alpha at the Wanderer's feet above a tree-class height threshold, so shallow roots and base decoration stay opaque while genuine trunk or canopy coverage fades normal, medium and hero trees. Medium families use fitted root-base collision, while the hero uses a broad major root-and-rock footprint."},{"id":"F02-US10","title":"Character Visual Direction","status":"Complete","summary":"The first Wanderer set remains accepted: 28 x 42 canvas, four directions, one idle and four walk frames per direction, 9 fps."},{"id":"F02-US11","title":"Subtle Environmental Motion","status":"Complete","summary":"Calm river surface movement is accepted for the POC through F18-US07. Optional vegetation motion remains desirable and is tracked separately under F03-US12; it does not keep this accepted river-motion scope open."},{"id":"F02-US12","title":"Lightweight Character Appearance Customization","status":"Backlog","summary":""},{"id":"F02-US13","title":"Player Camera Zoom Levels","status":"Complete","summary":"The current POC supports 1.0x, 1.5x, 2.0x, 2.5x and 3.0x, with 3.0x as the starting default from 13 October 2026. All five levels remain available for development; 2.0x remains an art-comparison reference. Release-facing framing policy is tracked separately in F02-US17."},{"id":"F02-US14","title":"Natural Vegetation Distribution","status":"Complete","summary":"The full-map ecological placement pass is accepted for the POC. Current accepted POC snapshot, 16 September 2026 Starting island: 130 normal harvestable trees, distributed 33 / 33 / 32 / 32 across four variants 3 medium oaks, 3 medium birches, 3 medium willows, with accepted POC harvesting; final depleted art is tracked by F03-US13 1 permanent non-harvestable hero tree 36 mineable rocks, 12 of each production rock variant 6 fallen logs Visible opposite banks: 467 production trees with 117 / 117 / 117 / 116 variant distribution 93 production rocks, 31 of each variant 16 fallen logs Placement uses repeated tendencies rather than exclusive zones: broad-canopy trees favour richer/interior pockets, birch recurs around lighter/open/gravelly ground, tall spiky/poplar trees favour several moist shoreline stretches, and drooping broadleaf trees have the strongest wet-bank tendency. Rocks repeatedly combine with gravel and vegetation. Dense pockets alternate with grass-rich/open traversal..."},{"id":"F02-US15","title":"Clean Gameplay View","status":"Complete","summary":""},{"id":"F02-US16","title":"Nature Dressing Pack A","status":"Complete","summary":"The production dressing vocabulary has been created, integrated and rolled out across the starting island and visible opposite banks, and the overall result is human-approved for the POC. Accepted principles grass/weeds/bushes/ground overlays create layered natural compositions dense local pockets are desirable when broad movement routes remain available open space should read as a field rather than a sterile lawn most micro-vegetation remains non-blocking three intentionally blocking Nature Dressing props retain compact collision/navigation obstruction ground overlays are kept out of water; plants/reeds may overlap shallow shoreline naturally"},{"id":"F02-US17","title":"Release Camera Framing & Zoom Limits","status":"Backlog","summary":"Review release-facing camera framing and movement balance together at the intended normal gameplay speed and realistic framing. Preserve mystery, readable artwork and slow, deliberate starting-island exploration. Exact camera values and zoom restrictions remain undecided. Extreme zoom restrictions are not approved and must not be implemented speculatively. F05-US11 separately explores elevated lookout / observation mode. Do not change the current POC camera implementation."},{"id":"F02-US18","title":"Final Ecology & Field Polish","status":"Complete","summary":"Large smooth lawn-like openings are no longer accepted. The approved direction is dense natural meadow across almost all traversable open land, using meadow ground, broad grass clusters, individual tufts and weeds with small irregular gaps. The current correction substantially increases non-blocking coverage on the starting island and visible banks without changing tree, rock or log counts. Growing vegetation remains upright: source and generated meadow PNGs use no vertical flip or rotation, placement suppresses plant rotation, and the 2D grass-batch renderer corrects its QuadMesh UV inversion. Known items, 14 September 2026 the central field and hero-tree meadow are accepted for the current POC; later release art polish may refine repeated overlay edges some shoreline-biased trees have sandy ground/base artwork that can mismatch the grass or non-sandy ground underneath local tree distributions still show noticeable concentrations (for example oak-heavy and poplar-heavy pockets);..."},{"id":"F02-US19","title":"Large Grass / Meadow Overlay Family","status":"Complete","summary":"As a player, I want broad open ground to contain larger natural grass compositions so that traversable fields look deliberately authored rather than like smooth green lawns. Intent create a small reusable family of approximately 3-4 large transparent grass/meadow overlays target roughly 100-250 px footprints where that reads naturally relative to the 42 px Wanderer; exact dimensions remain art-led match the accepted base-grass terrain colour extremely closely so overlays enrich rather than repaint the ground use irregular alpha edges, internal transparent gaps and varied grass density so repeated placement does not read like stamped circles/rectangles include useful roles such as sparse field, medium meadow, wilder grass pocket and wide transition/field-edge composition keep these overlays non-blocking; their purpose is visual richness, not collision allow trees, bushes, rocks and other dressing to overlap them naturally do not simply scale up existing small tufts; each overlay..."},{"id":"F02-US20","title":"Hero / Landmark Tree","status":"Complete","summary":"As an explorer, I want an occasional exceptional tree to act as a memorable natural landmark so that selected places gain stronger North Star-like focal composition without multiplying ordinary tree species. Accepted POC starting-island hierarchy start with one exceptional ancient broad-canopy tree rather than a hero-tree library substantially larger and more characterful than ordinary resource trees, with a strong silhouette and old/twisted trunk/root character same palette, perspective and native pixel-density family as the production environment possible moss/ground integration is welcome if it remains reusable approved as one unique starting-island landmark; no hero-tree library is currently planned intentionally excluded from ordinary resource gathering and intended to remain a permanent composition and navigation anchor rather than an ordinary resource tree one supplied ancient-tree sprite is integrated beside the starting-island meadow and human-accepted for the POC 130..."},{"id":"F02-US21","title":"Contextual Depth Sorting for Enterable Ruins","status":"Retired","summary":"The opposite-bank ruin is not currently intended to be enterable, so the earlier ruin-entry implementation task is retired. General depth-sorting considerations for future buildings and interiors are preserved in World Design section 11: split visual/depth sections where appropriate, consistent Y sorting, natural foreground/behind transitions without popping, and compatible collision/navigation. No ruin entry or doorway-blocker removal is approved."}]},{"id":"F03","title":"Interaction, Tools & Environmental Feedback","description":"Make interactions physical, readable and satisfying.","stories":[{"id":"F03-US01","title":"Clear Interaction Targeting","status":"Ready for development","summary":"Preserve accepted hover feedback. When the art is available, replace the generic hand cursor with appropriate axe, pickaxe or neutral contextual interaction cursors."},{"id":"F03-US02","title":"Tool-in-Hand Feedback","status":"Complete","summary":"Show the appropriate equipped tool during physical harvesting: axes for trees and pickaxes for rocks. Tool heads should make material tiers readable: wooden tools use brown heads, stone tools dark gray, iron tools light silver-gray, and later tiers follow the same visual principle. Iron, steel and stronger materials are future possibilities; durability, breakage, dropping and loss are not part of this implementation bundle. The current axe/pickaxe art and alignment are human-approved for the POC. The tool is not perfectly attached to the Wanderer's hand and may receive later polish; this does not keep Phase 1 open."},{"id":"F03-US03","title":"Tree Harvest Animation","status":"Complete","summary":"One click starts repeated axe swings, tree reaction/leaves, a short fall and stump/drop state. First-pass chopping audio is tracked separately under F03-US20 and accepted for the current POC. Only an axe can harvest a tree. A normal tree takes 6 hits with a Wooden Axe or 3 with a Stone Axe; a medium tree takes 12 or 6 respectively. Moving away cancels the active sequence but retains accumulated progress. See F03-US18 for tree tiers and F03-US19 for hardness and tool strength."},{"id":"F03-US04","title":"Rock Mining Animation","status":"Complete","summary":"One click starts repeated pickaxe strikes, rock tremble/debris, a short crumble and depleted state. First-pass mining audio is tracked separately under F03-US20 and accepted for the current POC. Only a pickaxe can mine a rock. A normal starting rock takes 6 hits with a Wooden Pickaxe or 3 with a Stone Pickaxe. Moving away cancels the active sequence but retains accumulated progress. See F03-US19 for hardness and tool strength."},{"id":"F03-US05","title":"Satisfying Item Drops","status":"Complete","summary":""},{"id":"F03-US06","title":"Satisfying Item Pickup","status":"Complete","summary":"Automatic short-range magnetic pull is accepted; repetitive +1 resource text is suppressed. The current attraction radius is 68.75 world pixels after the accepted 25% increase from 55; the short pull, pickup grace and reward quantities remain unchanged."},{"id":"F03-US07","title":"Chest Opening Feedback","status":"Complete","summary":""},{"id":"F03-US08","title":"Invalid Tool Feedback","status":"Complete","summary":"Existing invalid-tool feedback is implemented. For the approved harvesting progression, wrong or missing tools must prevent resource extraction and show the appropriate exact message: Tree without an axe: \"You could probably chop down this tree for wood if you had an axe.\" Rock without a pickaxe: \"You could probably break this rock for stone if you had a pickaxe.\""},{"id":"F03-US09","title":"Shallow Water Feedback","status":"Complete","summary":"Graduated water and wading feedback is accepted for the POC through F18-US04/F18-US08: clear-shallow movement at 0.70, a safe mid-depth warning state at 0.40, depth-linked submersion and restrained wake. The mid-depth multiplier 0.40 may be rebalanced later. Improved clear-shallow and mid-shallow splash/wake artwork is future polish under F03-US27; accepted depth, movement and drowning mechanics remain intact."},{"id":"F03-US10","title":"Drowning Feedback","status":"Complete","summary":""},{"id":"F03-US11","title":"Temporary Control Hint Instead of Permanent Overlay","status":"Complete","summary":"Approximately 10 seconds, fades, does not return after respawn."},{"id":"F03-US12","title":"Reactive Vegetation","status":"Backlog","summary":"Grass and suitable vegetation should react subtly when the Wanderer passes through. Very restrained ambient wind movement in suitable tree canopies, potentially around one pixel where appropriate, remains desirable. Optional reed or grass ambient sway may share an efficient lightweight approach. Future motion only; no animation is implemented by this documentation update. Keep the POC-approved river-motion story F02-US11 and accepted F18 implementation stories closed."},{"id":"F03-US13","title":"Species-Appropriate Harvested Tree States","status":"Complete","summary":"Create production stump states that visibly belong to the four normal tree families: broad oak-like, birch, tall/spiky poplar-like, and drooping broadleaf/willow-like. Preserve recognizable bark palette, trunk width and root/base character rather than merely recolouring one identical stump. Harvestable medium-tree families also require visibly larger mature stump/depleted states that retain their family identity and larger trunk/root scale. The hero tree requires no harvested state because it is excluded from ordinary harvesting. Keep the states practical for existing collision/harvesting logic; F03-US18 remains authoritative for interaction policy. Christiaan playtested and accepted all normal and medium stumps, including the revised willow and immediate medium-stump appearance, for the current POC. The separately noticed pause before visible medium-tree falling motion was traced to a blocking full-island navigation rebake. Post-harvest rebaking now runs in the background...."},{"id":"F03-US14","title":"Variant-Appropriate Depleted Rock States","status":"Complete","summary":"Create one clearly depleted/broken production state for each of the three accepted mineable rock variants. Each state should retain a relationship to its source rock while changing silhouette enough to read immediately as mined; tiny crack-only edits are not sufficient. Christiaan accepted the current three depleted-rock visuals for now; this polish pass does not alter them."},{"id":"F03-US15","title":"Individual Diegetic Resource Drops","status":"Complete","summary":"Four randomized quantity-one Wood pieces and three randomized quantity-one Stone pieces, 0.25-second pre-attraction grace, independent magnetic pickup and no x4/x3 labels are accepted for current normal resources. A normal tree remains worth 4 Wood. Medium trees now yield 12 Wood under F03-US18; their diegetic presentation may be tuned without changing the reward quantity."},{"id":"F03-US16","title":"Production Wood & Stone Pickup Art","status":"Complete","summary":"As a player, I want harvested resource pieces to use production-quality art so that the accepted diegetic drop behaviour no longer reveals placeholder visuals. Christiaan accepted the current Wood and Stone pickup art and behaviour for now; this polish pass does not alter them. Intent create one production sprite for one Wood unit; four copies must read naturally as four harvested wood pieces create one production sprite for one Stone unit; three copies must read naturally as three loose stones keep both substantially smaller than the source tree/rock world objects preserve current randomized scatter, 0.25-second grace and magnetic pickup behaviour use transparent backgrounds and the existing tree/rock palette families do not confuse the small Wood pickup with the larger decorative fallen-log prop"},{"id":"F03-US17","title":"Production Chest Art Family","status":"Complete","summary":"As a player, I want chests to use one coherent production-art family so that exploration rewards look intentional on both the starting island and distant banks. Intent create at least closed and open/empty states readable beside the 42 px Wanderer at normal gameplay distance warm weathered wood/metal construction, adventurous but not cartoonishly exaggerated transparent background and production-consistent pixel density reuse the same closed chest sprite for the starting-island chest and opposite-bank chest; do not invent an unrelated distant-chest design preserve existing chest behaviour; this story is visual replacement, not a loot-system redesign Accepted implementation uses matched 52 x 48 closed/open production sprites for both chest instances. Human playtesting confirmed correct scale, opening, stationary alignment without jitter and collision. The starting-island reward is now a Wooden Axe under F04-US04; the opposite-bank Stone Pickaxe reward stays as implemented."},{"id":"F03-US18","title":"Tree Size-Tier Harvesting & Protected Landmark Tree","status":"Complete","summary":"As a player, I want ordinary and mature resource trees to remain removable while exceptional landmark trees remain permanent, so that I can reshape the playable landscape without accidentally destroying important world identity. Authoritative tree-tier rule Normal tree = ordinary resource. Medium tree = valuable removable resource and landscape-shaping choice. Hero tree = permanent landmark. Normal trees remain ordinary harvestable resource trees retain the current 4 Wood reward take 6 hits with a Wooden Axe or 3 with a Stone Axe under the current one-click automatic harvesting interaction Medium / mature trees are intentionally harvestable so players can later reshape land for buildings, paths, sightlines, settlement layout and personal preference award 12 Wood have exactly double normal-tree hardness for now: 12 hits with a Wooden Axe or 6 with a Stone Axe have accepted Phase 1 hit reaction and fall feedback; any stronger presentation is optional later polish, not a condition for..."},{"id":"F03-US19","title":"Resource Hardness and Tool Harvesting Strength","status":"Complete","summary":"As a player, I want stronger tools to harvest the right resources in fewer hits so that tool progression remains useful as harder resources appear. represent resource hardness and tool harvesting strength in data rather than hard-coding each resource/tool pair enforce tool categories: axes harvest trees only, pickaxes mine rocks only, and a wrong or missing tool cannot harvest support the approved starting hit counts in F03-US03, F03-US04 and F03-US18 without fixing an inflexible mathematical formula yet allow stronger future tools to reduce a resource to one required hit, and harder trees and rocks in later zones to preserve progression retain accumulated hits when the player moves away or otherwise interrupts harvesting; cancel the active sequence without resetting progress"},{"id":"F03-US20","title":"Harvest Interaction Sounds","status":"Complete","summary":"As a player, I want tree chopping and rock mining to have distinct, believable sound effects so harvesting feels physical and readable. use distinct wood and stone cues triggered on the actual valid harvest hit keep volume restrained and repeated hits free of unpleasant overlap use original/project-owned or otherwise clearly commercial-safe assets with recorded provenance allow later variation without requiring a large audio architecture retain all accepted harvesting mechanics; Christiaan accepted the first-pass sound character for the current POC"},{"id":"F03-US25","title":"Hybrid Tree Stump Decay and Manual Removal","status":"Backlog","summary":"As a player, I want tree stumps to eventually disappear naturally, while also having a way to remove them sooner, so that I can clear land for future building, landscaping and tree planting. Design direction Chopping a tree leaves a visible stump for a meaningful period. Approximately five minutes of gameplay time is an initial decay hypothesis, subject to playtesting. After sufficient time, the stump disappears naturally. A later appropriate tool or mechanic may allow immediate manual removal for intentional land clearing. The exact lifetime, tool, recipe and unlock requirements are not finalized. Acceptance criteria for future implementation Normal and medium tree stumps remain visible until natural decay or a valid manual-removal action occurs. Natural decay uses tunable elapsed gameplay time; pausing gameplay does not advance decay. A future approved manual-removal action clears the stump sooner without granting duplicate chopping rewards. Either removal route clears the..."},{"id":"F03-US26","title":"Developer Mode: Instant Harvest","status":"Complete","summary":"Priority: Preferred near-term implementation candidate. As a developer, I want to enable instant harvesting of trees and rocks so that I can quickly test resource depletion, land clearing and dynamic map updates without repeatedly performing normal harvesting actions. Desired outcome: developer-only rapid resource harvesting for large-scale island testing and diagnosing inaccessible trees (BUG-005), without changing ordinary player harvesting behaviour. Acceptance criteria for future implementation 1. Activate Instant Harvest and Deactivate Instant Harvest buttons in the existing Developer panel enable or disable this testing override independently of the speed controls. The currently applicable action stays enabled; the opposite action is disabled to show the current state. 2. While enabled, a valid harvesting interaction immediately completes harvesting of the targeted regular tree, medium tree or rock. Normal targeting, reach, tool eligibility and protected-object checks still apply; invalid interactions remain invalid. 3. Normal rewards are granted exactly once. The resource enters the same depleted state and retains the same stump/rubble behavior as ordinary harvesting. 4. The same world-state notifications and dynamic cartography updates occur as with ordinary depletion, whether the map is open or closed. 5. With the override disabled, ordinary player harvesting uses its existing cadence, required impacts and rewards. Switching it off restores normal harvesting without duplicate completion or rewards. Implementation and automated validation, 16 October 2026 The Developer panel has Activate Instant Harvest and Deactivate Instant Harvest buttons, with the override off at session start. Disabled button states indicate the current mode. These replace the original toggle without changing the override. Valid in-range normal trees, medium trees and rocks receive one final hit through the existing harvesting completion path. Tool ownership/category and Hero Tree protection remain intact. Accepted depletion art, collision/navigation changes, individual drops and magnetic pickups are retained; live cartography updates with the map open or closed. Deactivating restores ordinary cadence without altering retained partial damage or creating extra rewards. Falling/crumbling presentation and pickup grace still use their existing timing. Automated validation: 347 checks across seven suites, zero assertion failures; see VALIDATION.md. This remains a developer-only testing convenience; stump decay/removal is still future scope under F03-US25. Human acceptance, 16 October 2026 Christiaan human-playtested and approved F03-US26. The test cleared nearly the entire starting island, with normal harvesting rewards, resource depletion and dynamic parchment-map updates working correctly. F03-US26 is Complete. The remaining inaccessible harvestable tree is a separate report under BUG-005 and does not reopen this accepted developer feature."},{"id":"F03-US27","title":"Polish Shallow-Water Splashes and Wake","status":"Backlog","summary":"Improve the basic-looking player-created splashes and wake in clear shallow and mid-shallow water. Prefer restrained visuals matching the Concept A / North Star artwork, with readable local disturbance that settles quickly when the Wanderer stops. Preserve accepted depth, movement and drowning mechanics, including the current 0.70/0.40 movement multipliers. This is focused future visual polish, not a reopening of F03-US09 or F18-US04/F18-US08. No gameplay implementation or new art generation is part of this documentation update."},{"id":"F03-US29","title":"Deep-Water Struggle and Drowning Warning","status":"Playtesting","summary":"As a player, I want clear danger feedback and a short opportunity to retreat when I enter deep water, so that the Wanderer's inability to swim is understandable while the river remains uncrossable until future boat progression. Approved initial parameters and acceptance criteria, 18 October 2026 1. In Drown mode, entering the existing Deep classification starts a 10-second air budget and emits \"You can't swim! Turn back!\" once per danger episode. The episode ends on full recovery, preventing warning spam during partial shallow/deep boundary crossings. New fully recovered entries can warn again. 2. Ten small programmatically drawn pixel bubbles show remaining air in one horizontal row centered above the Wanderer's head, with vertical clearance. All ten slot positions stay fixed as bubbles disappear; remaining bubbles never re-center. Preserve their pixel-art appearance across camera zoom levels. The contextual indicator follows the player, remains visible during recovery and hides once full outside deep water. No permanent HUD, large bar or numeric timer. 3. Air decreases only in Deep water, using unpaused gameplay seconds. Safe dry, clear-shallow and mid-shallow water stop air loss and restore it gradually: zero-to-full in approximately 2 seconds, proportionally for partial loss. Re-entry retains the current air level; safe recovery cannot cause drowning. 4. Drown-mode deep movement uses an initial 0.12 speed multiplier and is confined to approximately 40 world pixels beyond safe-water geography. These are game coordinates, not real-world metres. A fixed polygon fringe is derived from the existing safe-depth contours and river envelope, never from entry position. Swept movement and collision-deflection checks prevent direction changes, repeated entries, WASD, right-click, held steering or developer speed tiers from crossing the deep channel. Retreat and tangential movement remain possible without snapping or teleporting; restrained ripples indicate attempted struggle at the limit. Safe clear/mid movement remains 0.70/0.40. 5. Only air exhaustion in Deep emits the existing drowning event, once. Preserve the black screen/message, independent 0.35-second music fade-out, current spawn, inventory/world state and music quiet/retrigger rules. Respawn restores full air. Successful entry/retreat/recovery never stops music. 6. Block keeps its accepted blocking/correction behaviour without an air countdown. Pass through and the compatibility exploration override remain unrestricted developer exploration without drowning. Switching from Pass through while already outside the normal fringe allows retreat toward safety without an additional forward allowance. Developer modes remain independent of Instant Harvest and music controls. 7. Parchment pause freezes both air loss and recovery with gameplay while existing music continues. Closing resumes the interrupted state. Keep the existing playlist, soundscape, sliders/preferences, Play Music/Stop music and Suno records. Implementation, scope and validation Human playtest feedback, 18 October 2026: the movement restriction and warning feel intuitive. Before final acceptance, center the fixed ten-bubble row above the head and shorten full recovery from four to two seconds. These refinements retain the countdown, warning/modes, movement limit, map pause and death/music flow. F03-US29 remains Playtesting pending final human acceptance. The existing F18 depth classifications and authored geography are unchanged. scripts/deep_water_safety.gd derives the fixed 40-pixel fringe once, then sweeps motion at at most 1-world-pixel intervals. The air state belongs to the current island session; scenes/player/air_bubbles.gd draws contextual bubbles and struggle ripples. No swimming, current simulation, navigation redesign, save system, new audio/art assets, death penalties or boat functionality. Depends on the accepted F03-US09/F03-US10 and F18-US04/F18-US08 water behaviour. Those stories and the accepted F18 geometry remain Complete. F03-US28 is a retained historical reference to BUG-005, so it is not reused. Automated timing, movement, channel-connectivity, mode, pause, music and gameplay checks are recorded in VALIDATION.md. Pending Christiaan's human acceptance of warning clarity, bubble readability, struggle/retreat feel and the death/recovery sequence. Do not mark Complete before acceptance. F10-US07 retains Playtesting. ---"}]},{"id":"F04","title":"Progression, Inventory & Crafting","description":"Simple progression where resources/tools expand capability without inventory becoming a chore.","stories":[{"id":"F04-US01","title":"Reliable Basic Inventory","status":"Complete","summary":""},{"id":"F04-US02","title":"Simple Crafting Interface","status":"Complete","summary":"The interface crafts every early tool, including the Wooden Axe found first in the starting chest. Current recipes: Wooden Axe: 3 Wood Wooden Pickaxe: 3 Wood Stone Axe: 1 Wooden Axe + 3 Stone Stone Pickaxe: 1 Wooden Pickaxe + 3 Stone"},{"id":"F04-US03","title":"Tool Requirement for Stone","status":"Complete","summary":"Current POC mining requires a pickaxe, and trees require an axe. Category enforcement belongs to F03-US08 and F03-US19."},{"id":"F04-US04","title":"Starting Chest Introduces the Wooden Axe","status":"Complete","summary":"The existing starting-island chest is near spawn, visible within the initial camera view but not directly beside the Wanderer. No other island chest was added. Its one-time reward is 1 Wooden Axe with the exact message: \"You found a Wooden Axe in the chest.\" The chest supplies the first axe, while the same Wooden Axe remains craftable for 3 Wood. The opposite-bank chest keeps its Stone Pickaxe reward, placement and normal interaction range. The old island-chest Stone Pickaxe shortcut is superseded. Intended opening path: Start -> visible nearby chest -> Wooden Axe -> trees -> Wood -> Wooden Pickaxe -> rocks -> Stone -> Stone Axe / Stone Pickaxe. Preserve the accepted chest art and closed/open interaction behavior. Local visibility cleanup, 9 October 2026: Starter chest stays at (-250, 260) with its accepted one-time Wooden Axe reward. Only the adjacent obscuring tree was removed; opposite-bank Stone Pickaxe chest is unchanged. Human-playtested and accepted by Christiaan on 9..."},{"id":"F04-US05","title":"Data-Driven Item Definitions","status":"Complete","summary":"Existing centralized GDScript item definitions satisfy the current POC requirements. The completed POC does not implement future metadata/equipment. Approved keep_on_death and equipment scope now belong to F04-US12/US14; richer architecture, equipment identity and durability remain undecided."},{"id":"F04-US06","title":"Upgrade Old Gear Instead of Replacing It","status":"Complete","summary":"The current Stone Axe and Stone Pickaxe recipes consume the corresponding Wooden Axe and Wooden Pickaxe, satisfying the POC upgrade requirement. Later upgrade tiers, identity, durability, breakage and item-dropping details remain undecided. Future Hardcore tool/item loss is now approved under F14, with F04-US11/US12 recovery/protection; none changes this completed POC upgrade behaviour."},{"id":"F04-US07","title":"Avoid Late-Game Inventory Clutter","status":"Backlog","summary":"Keep this story focused on stacking, duplicate-tool quantities, inventory organization and unwanted-loot clutter. Grid, list or hybrid presentation remains undecided. F04-US13 owns container contents and safe transfers; F04-US14 owns carried/equipped management. Do not merge away the separate story IDs."},{"id":"F04-US08","title":"Multiple Paths to Expensive Progression","status":"Retired","summary":"No sufficiently defined requirements exist for this implementation story. Revisit alternative progression paths during future game design if needed; retirement does not claim implementation or acceptance of a progression system."},{"id":"F04-US09","title":"Craft Stone Pickaxe","status":"Complete","summary":""},{"id":"F04-US10","title":"Discover Significant Crafting Recipes","status":"Backlog","summary":"Significant recipes may be learned through exploration, clues, notes/drawings, chests, environmental interactions, ingredients, creatures, NPCs, experimentation or crafting stations. These are design possibilities, not confirmed mechanics. Important hidden progression recipes, especially the eventual boat solution, should not automatically appear in the starting crafting menu. Exact knowledge rules and crafting UI remain undecided; the current simple POC recipe list remains valid. F05-US08 covers secrets and discoveries beyond crafting recipes."},{"id":"F04-US11","title":"Primitive Wood Gathering and Tool Recovery","status":"Backlog","summary":"Scope: Demo core recovery capability. Approved future design, not current POC implementation. Acceptance criteria for future implementation Allow slow tool-free Wood gathering from eligible ordinary trees, considerably less productive than an axe. Support rebuilding essential basic tools after loss, without prematurely felling trees or duplicating resources. Keep a recoverable basic wood source possible even when the immediate area was previously harvested; the exact recovery mechanism remains undecided. Preserve existing basic axe/pickaxe recipes without mandatory workbenches or character levels. Coordinate with F14 recovery."},{"id":"F04-US12","title":"Protected Items and Progression Safety","status":"Backlog","summary":"Scope: Progression safety; future Hardcore compatibility. Approved future design, not current POC implementation. Acceptance criteria for future implementation Developer-controlled item-level keep_on_death defaults to false; protection applies whether carried or equipped. Protect indispensable unique puzzle/quest/progression items, or make them reliably recoverable. Prevent irreversible loss, selling or misuse that would softlock progression. Allow legitimate intended puzzle consumption. The illustrative three black eggs and lizard scale are not approved world lore. Coordinate death handling with F14 and persistence with F15-US03. Ordinary equipped items receive no automatic protection."},{"id":"F04-US13","title":"Secure Item Storage","status":"Backlog","summary":"Scope: Optional Steam-demo stretch. Approved future design, not current POC implementation. Acceptance criteria for future implementation Physical chests have separate persistent contents, safe quantity transfers and protection against duplication or silent destruction. Stored items survive character death in every mode. Full chests cannot become unrestricted portable backpacks by being moved. F08 owns creating/placing chests; F04 owns container inventory behaviour. Persist contents through F15-US03."},{"id":"F04-US14","title":"Backpack and Equipment Management","status":"Backlog","summary":"Scope: Demo equipment support; broader full-game management. Approved future design, not current POC implementation. Acceptance criteria for future implementation Separate carried and equipped items with equip/unequip interactions and consistent quantity management. Equipped items follow item-level keep_on_death; ordinary equipped gear is lost on future Hardcore death. Coordinate gear capabilities with F07, stacking/organization with F04-US07 and persistence with F15-US03."}]},{"id":"F05","title":"Exploration, World Structure & Discovery","description":"Use curiosity, visible unreachable places and natural capability gates to pull the player through the world.","stories":[{"id":"F05-US01","title":"Island Surrounded by River","status":"Complete","summary":""},{"id":"F05-US02","title":"Visible Opposite Riverbanks","status":"Complete","summary":"The far banks now also receive full ecological/resource dressing so they read as real continuation terrain rather than sparse scenery."},{"id":"F05-US03","title":"Opposite-Bank Stone Ruin","status":"Complete","summary":"The placeholder was replaced by a production ancient stone ruin downscaled directly from the large master to the accepted 200 x 200 game asset. Its shoreline placement and scale are human-approved. Fitted solid masonry collision preserves the open stair corridor and temporary doorway threshold blocker. The opposite-bank ruin is not currently intended to be enterable. F02-US21 is Retired; general depth-sorting considerations for future buildings/interiors remain in World Design section 11."},{"id":"F05-US04","title":"Opposite-Bank Closed Chest","status":"Complete","summary":"The accepted distant placement uses the same production closed/open chest art and one-time interaction behavior as the starting-island chest. Its reward remains 1 Stone Pickaxe after the island chest changes to a Wooden Axe. It cannot be opened remotely and remains unreachable during normal current gameplay. F18 acceptance, 8 October 2026: current chest composition is accepted for the POC; later environmental dressing may reduce its isolated appearance without reopening F18."},{"id":"F05-US05","title":"X Marks the Spot","status":"Complete","summary":"The wooden-looking placeholder was replaced by the accepted production sand patch with the X dug into the ground. Its scale and shoreline placement are human-approved, and it remains walkable as intended. F18 acceptance, 8 October 2026: the scraped-sand X is accepted; richer environmental storytelling is deferred to this existing exploration story."},{"id":"F05-US06","title":"Natural Boundaries Instead of Invisible Walls","status":"Complete","summary":""},{"id":"F05-US07","title":"Exploration Rewards Support Progression","status":"Complete","summary":"The former island-chest Stone Pickaxe shortcut is superseded by F04-US04. The visible near-spawn chest rewards discovery with the first Wooden Axe and introduces the intended harvesting path. The same axe is also craftable. Future exploration rewards may still offer alternate or accelerated paths when separately designed; the opposite-bank chest retains its Stone Pickaxe reward."},{"id":"F05-US08","title":"Hidden Discoveries","status":"Backlog","summary":"Secrets and discoveries beyond crafting recipes may include hidden environmental details, island history, lore, mysterious locations and clues. The island's history and actual discoveries still need design; no new lore is approved here. Recipe discovery remains governed by F04-US10."},{"id":"F05-US09","title":"Discovery Guidance Without Mandatory Quests","status":"Backlog","summary":"Offer subtle, optional discovery feedback, potentially through a journal, achievement-like milestones or recognition of significant findings. These are candidate approaches, not confirmed systems. Avoid mandatory quest chains, excessive markers and intrusive checklists."},{"id":"F05-US10","title":"World Expansion Changes the Player's Mental Map","status":"Retired","summary":"World expansion changing the player's mental map is a design principle rather than a standalone implementation task. Preserve See -> Want -> Prepare -> Cross -> Discover -> Master -> See Further in World Design section 7.6. This retirement does not mark new gameplay Complete."},{"id":"F05-US11","title":"Elevated Lookout / Observation Mode","status":"Backlog","summary":"As an explorer, I want certain elevated viewpoints to reveal a much wider temporary view so that scouting the world feels like a discovery capability rather than a permanent camera convenience. Candidate direction a craftable simple wooden lookout tower is one possible first example natural cliffs, towers, treehouses or other viewpoints may later use the same idea while at the lookout, temporarily allow a far zoom comparable to current 1.5x/1.0x developer overview do not allow normal free roaming at that far overview while using this mechanic exact camera values, construction cost and controls are not decided do not implement during the current POC visual pass This story is intentionally connected to F02-US17 but does not lock the release camera design yet."},{"id":"F05-US12","title":"Progressive Travel Mobility","status":"Backlog","summary":"As a player, I want travel to become faster and more convenient as I progress so that early distance feels meaningful without late-game traversal becoming a chore. Direction preserve meaningful early on-foot distance rather than solving world scale with permanently high base speed later progression may provide roads, boats, mounts, shortcuts, transport systems or carefully designed fast travel unlocks should make previously large distances feel increasingly manageable, similar to how other exploration games let mobility improve over time exact systems and unlock order remain TBD Deferred until larger zones or substantial travel distances justify mobility progression. Preserve slow, deliberate starting-island exploration; no travel system is implemented by this clarification."},{"id":"F05-US13","title":"Hidden Boat-Enabled Demo Crossing","status":"Backlog","summary":"Approved future Steam-demo direction, not current POC behaviour: The central question is \"Can I get Beyond the River?\" A non-obvious but discoverable progression/crafting chain should eventually enable boat construction and genuine river crossing. Clues, experimentation and environmental knowledge should make the solution inferable without requiring ordinary players to solve it for the island experience to feel worthwhile. Reaching the opposite bank is the hidden/true demo completion condition. Exact boat recipe and dependency chain remain undesigned. F09 now owns the approved B + D cinematic crossing, far-shore reveal and Return Home travel; see F04-US10 for recipe discovery. Combat, trade and XP thresholds must not gate the boat."},{"id":"F05-US14","title":"Hidden Demo Completion Presentation","status":"Backlog","summary":"After the player reaches the opposite bank through the future hidden crossing, first acknowledge the achievement with the preferred end copy recorded in the Project Context, then offer a secondary wishlist/follow/feedback invitation. Exact Steam buttons, links and CTA UX remain future work; this is not a current POC screen. F05 owns discovery/completion recognition, F09 owns B + D crossing and Return Home, and F15 owns release-facing presentation/distribution."},{"id":"F05-US15","title":"Starting-Island Environmental Mystery","status":"Backlog","summary":"Let exploration raise questions about why the Wanderer and island are here, what happened, and what lies beyond the river. Prefer discoverable clues and world details to exposition dumps. The exact story, protagonist backstory and island history are not yet designed; do not treat possible notes, ruins or abandoned objects as established lore."}]},{"id":"F06","title":"Combat & Enemies","description":"Approved limited combat supports exploration rather than combat farming. The Steam demo has one optional territorial quarry encounter. No starting-island bosses or demo boss system are required. Ordinary behaviour works locally without F16 external AI.","stories":[{"id":"F06-US01","title":"Contextual Targeting and Timed Melee","status":"Backlog","summary":"Scope: Steam-demo core combat support. Approved future design, not current POC implementation. Acceptance criteria for future implementation Contextual left-click on an enemy selects/approaches the target and starts automatic timed melee attacks. Keep targeting and attack timing readable alongside existing contextual harvesting and friendly interactions. Exact damage values and cadence need playtesting; no additional combat mechanics are approved here."},{"id":"F06-US02","title":"Responsive Retreat and Disengagement","status":"Backlog","summary":"Scope: Steam-demo core combat support. Approved future design, not current POC implementation. Acceptance criteria for future implementation WASD retreat responds immediately during combat. Right-click disengages and moves away using the existing movement language. Do not trap the player in an automatic attack sequence."},{"id":"F06-US03","title":"Emergency Tools and a Dedicated Weapon","status":"Backlog","summary":"Scope: Steam-demo core combat support. Approved future design, not current POC implementation. Acceptance criteria for future implementation Axes and pickaxes can serve as emergency weapons. One dedicated crafted weapon offers a meaningful advantage over emergency tools. Exact weapon, recipe and balance remain undecided."},{"id":"F06-US04","title":"Readable Health, Damage, Defeat and Recovery","status":"Backlog","summary":"Scope: Steam-demo core combat support. Approved future design, not current POC implementation. Acceptance criteria for future implementation Communicate health, damage, defeat and safe recovery clearly. Standard Adventure retains XP, items and progression on defeat; preserve F14 authority for future modes and permanent progression. Do not confuse this future health/combat system with accepted POC drowning or its Playtesting warning refinement."},{"id":"F06-US05","title":"Fair Enemy Warnings and Territorial Behaviour","status":"Backlog","summary":"Scope: Steam-demo core encounter support. Approved future design, not current POC implementation. Acceptance criteria for future implementation Enemies communicate warning and territorial intent understandably before danger becomes unfair. Use bounded pursuit and a readable return to territory; exact warning distances and timings remain subject to playtesting."},{"id":"F06-US06","title":"Optional Northeast Quarry Rock Beetle","status":"Backlog","summary":"Scope: Steam-demo core optional encounter. Approved future design, not current POC implementation. Acceptance criteria for future implementation One optional territorial rock beetle occupies the northeast quarry, warns, pursues within a limited area and returns to its territory. Once defeated, it remains defeated until a new session. Cross-session reset meaning must be reconciled with F15 playthrough persistence before implementation. Rich stone may be softly gated by the beetle, but combat must never be required for the hidden boat objective."},{"id":"F06-US07","title":"Peaceful Completion and Non-Punitive Standard Defeat","status":"Backlog","summary":"Scope: Steam-demo core safety. Approved future design, not current POC implementation. Acceptance criteria for future implementation Normal Adventure defeat retains XP, items and progression and respawns the player safely, coordinated with F14. The boat mystery and demo level cap remain attainable without combat. No starting-island boss or demo boss-system dependency. Future Hardcore loss is separate from standard combat difficulty and follows F04 protection and F14 rules."}]},{"id":"F07","title":"Loot, Gear & Character Progression","description":"XP and player levels are intended to become a major long-term motivation/unlock spine while geography, equipment and exploration remain meaningful.","stories":[{"id":"F07-US01","title":"Player XP and Levels","status":"Backlog","summary":"Scope: Limited Steam-demo progression; broader full-game progression. Meaningful XP and character levels complement equipment capabilities, material-based gathering-tool upgrades, discoveries and acquired knowledge. Demo levels 1 to 3 are provisional, not final balance. Peaceful players must reach the demo cap without combat, stretch features or boring grinding. Exact XP curve, health increases and level cap require playtesting. The hidden boat has no player-level or XP-threshold gate."},{"id":"F07-US02","title":"Level-Based Unlock Progression","status":"Backlog","summary":"Scope: Limited Steam-demo progression; broader full-game unlocks later. Automatic level rewards may include modest maximum-health increases and selected utility crafting unlocks, subject to playtesting. Keep F04-US10 authoritative for significant recipe knowledge, especially the boat. Existing basic axe/pickaxe recipes require no character level or mandatory workbench. Boat discovery/completion must never require a particular level or XP threshold."},{"id":"F07-US03","title":"XP From Meaningful Play, Not Grinding","status":"Backlog","summary":"Scope: Steam-demo progression and full-game principle. Award XP primarily for meaningful play such as exploration, first-time crafting, construction milestones and discoveries. Repetition must not become an efficient infinite XP farm. Peaceful players can reach the demo cap without mandatory combat, stretch features or boring grinding. Exact rewards and anti-farming balance remain subject to playtesting."},{"id":"F07-US04","title":"Practical Equipment and Weapon Capabilities","status":"Backlog","summary":"Scope: Limited Steam-demo gear; broader full-game tiers. Approved future design, not current POC implementation. Acceptance criteria for future implementation Demo scope includes one dedicated weapon, coordinated with F06-US03, rather than full sets or extensive loot tables. Full-game equipment can be found, crafted, traded or occasionally earned from encounters. Add broader tiers, weapons and armour only when meaningful encounters justify them. F04-US14 owns equipping and quantities; gear effects depend on the relevant combat, movement and camera systems."},{"id":"F07-US05","title":"Explorer's Boots Movement Reward","status":"Backlog","summary":"Scope: Steam-demo gear direction. Approved future design, not current POC implementation. Acceptance criteria for future implementation Explorer's Boots provide a noticeable movement bonus. Compare approximately +10%, +15% and +25% in playtesting before deciding. No final bonus or change to the accepted POC movement baseline is approved."},{"id":"F07-US06","title":"Helmet of Farsight","status":"Backlog","summary":"Scope: Optional Steam-demo stretch reward. Approved future design, not current POC implementation. Acceptance criteria for future implementation Offer one additional zoom-out step only if supported by the eventual F02-US17 release camera design. Do not pre-empt release framing, require this item for the boat or change current POC zoom controls."},{"id":"F07-US07","title":"Restrained Specialization and Material Tool Upgrades","status":"Backlog","summary":"Scope: Full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Support meaningful future improvement choices without rigid mandatory classes, alongside material-based gathering-tool upgrades. Discoveries and acquired knowledge remain distinct progression. Avoid a large skill tree or full equipment sets in the demo; exact specialization remains undesigned."}]},{"id":"F08","title":"Building & World Creation","description":"Construction architecture unresolved: A, handcrafted blueprints across suitable cleared island space; B, guided modules initially in a designated area. Decide before substantial F08 implementation. Candidate US03-US09 are not approved stories.","stories":[{"id":"F08-US01","title":"Small Demo Building and Crafting Showcase","status":"Backlog","summary":"The future Steam demo should ideally offer a small but meaningful sample of building/world modification alongside harvesting and crafting. Basic construction or crafting infrastructure may support the hidden boat-progression puzzle while previewing the broader game. Shelter, workshop, stations, processed materials and specialised components are speculative examples only. No exact building, station, resource, recipe or number of progression steps is approved. This is not current POC scope."},{"id":"F08-US02","title":"Plant Trees and Reforest Cleared Areas","status":"Backlog","summary":"As a player, I want to deliberately plant trees/saplings and restore cleared forest areas so that I can shape the landscape and rebuild woodland over time. Approved future design direction Saplings visibly develop toward mature trees. Trees remain consistent with established species, artwork and ecological composition. Replanting interacts meaningfully with cleared ground and the future stump-removal system under F03-US25. Do not assume every harvested tree automatically regrows. Decorative saplings may also provide ecological variation. Exact growth time, planting resources, species rules, placement restrictions, harvesting balance and inventory UI remain undecided. Planting/regrowth is approved future direction, not existing POC behaviour or a current implementation commitment. Farming is separate and is not approved by this story. Future planted/growing tree state should remain compatible with the live-data cartographic representation under F11-US07. Mapping is not expanded or..."}]},{"id":"F09","title":"Travel, Biomes & World Expansion","description":"Approved primary Steam-demo ending is B + D: discover/build the hidden boat, launch, witness a pre-rendered cinematic crossing, arrive at the far shore and reveal the larger world, then choose Return Home or End Demo. No pre-departure Keep Exploring / Set Sail choice or manually steerable demo boat is required. F04 owns recipe knowledge, F05 discovery and completion recognition, F09 crossing/return, and F15 release presentation and distribution. Exact boat recipe, cinematic production, controllable boats, geography and transport hierarchy remain undecided.","stories":[{"id":"F09-US01","title":"Launch the Completed Hidden Boat","status":"Backlog","summary":"Scope: Steam-demo core, B + D ending. Approved future design, not current POC implementation. Acceptance criteria for future implementation Launch the boat after hidden discovery and construction; do not expose the solution in the starting recipe list. Use F04-US10 recipe knowledge and F05 hidden discovery/completion ownership. No combat, barter or XP gate."},{"id":"F09-US02","title":"Cinematic River Crossing","status":"Backlog","summary":"Scope: Steam-demo core, B + D ending. Approved future design, not current POC implementation. Acceptance criteria for future implementation Show a pre-rendered cinematic crossing after launch. Production details and assets remain separate future work. No manually steerable boat or pre-departure Keep Exploring / Set Sail choice."},{"id":"F09-US03","title":"Far-Shore Arrival and Larger-World Reveal","status":"Backlog","summary":"Scope: Steam-demo core, B + D ending. Approved future design, not current POC implementation. Acceptance criteria for future implementation Reach the far shore and reveal the larger world as hidden/true completion. Coordinate achievement recognition with F05-US14 and release presentation with F15, then offer Return Home or End Demo."},{"id":"F09-US04","title":"Return Home and Continue Playing","status":"Backlog","summary":"Scope: Steam-demo core, B + D ending. Approved future design, not current POC implementation. Acceptance criteria for future implementation Return Home resumes island play with no second boat required. End Demo remains the other post-ending option; returning to the main menu is separate. Preserve inventory, equipment, XP, levels, recipes, discoveries, puzzle state, buildings, storage, harvested resources, map knowledge and completed hidden-ending state. Do not immediately replay the ending or award duplicate rewards. Preserve progress after closing/reopening through F15-US03 release save/load."},{"id":"F09-US05","title":"Optional Playable Far-Shore Teaser","status":"Backlog","summary":"Scope: Conditional Steam-demo stretch only. Approved future design, not current POC implementation. Acceptance criteria for future implementation A small playable far-shore developer playground is conditional and is not required by the selected B + D ending. A humorous fourth-wall-breaking Easter egg may appear only if this alternative is later selected."},{"id":"F09-US06","title":"Connected Regions and Distinct Biomes","status":"Backlog","summary":"Scope: Full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Connect handcrafted regions with distinct biome identities while preserving exploration-focused geography and natural boundaries. Exact regional geography remains undecided; no full biome library is committed for the demo."},{"id":"F09-US07","title":"Large-Zone Loading and Performance","status":"Backlog","summary":"Scope: Full game, when justified. Approved future design, not current POC implementation. Acceptance criteria for future implementation Address loading and performance when larger connected zones justify it. Do not introduce speculative streaming architecture into the demo."},{"id":"F09-US08","title":"Progressive Travel Capabilities","status":"Backlog","summary":"Scope: Full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Let new travel capabilities make later journeys more convenient while early on-foot distance remains meaningful. Coordinate with F05-US12 mobility principles; future controllable boats and transport hierarchy remain undecided."}]},{"id":"F10","title":"Audio, Atmosphere & Music","description":"","stories":[{"id":"F10-US01","title":"Core POC Sound Feedback","status":"Complete","summary":"Dry/wet steps, pickup, chest and drowning cue character are accepted for the first POC audio baseline."},{"id":"F10-US03","title":"Open and Wooded Environmental Ambience","status":"Complete","summary":"As a player, I want the ambient soundscape to reflect whether I am standing in open grassland or among substantial tree cover so that the world feels spatially different even before I look closely at the scenery. Approved direction Use authentic, natural, realistic daytime field recordings. One shared gentle wind/leaf recording supports four overlapping starting-island acoustic identities: Open meadow: gentle light wind, little foliage emphasis, sparse birds and occasional grasshopper phrases. Woodland: slightly more foliage presence and more frequent birds, retaining a sheltered, calm character with quiet intervals. Northeast stone quarry: modestly more exposed wind, minimal woodland character and very little bird/insect activity. No artificial mining or rock-fall ambience. Shoreline: underlying wind plus gentle freshwater lapping. Nearby vegetation still determines woodland/wildlife influence; woodland beside water may combine both identities. Do not add stronger gust recordings,..."},{"id":"F10-US04","title":"Shoreline and Slow-River Ambience","status":"Complete","summary":"As a player, I want the riverbank to have its own restrained ambient identity so that approaching the water feels acoustically different from standing inland. Approved direction The broad, slow freshwater river uses TRP's approved gentle river-lapping recording, with source details in AUDIO_ASSETS.md. Water increases gradually near the actual authored shore and decreases inland. Suggest small wind-driven ripples touching the bank, without ocean surf, breakers, swell, rapids or dramatic current. Keep water restrained. Nearby vegetation independently controls foliage and wildlife, including wooded shorelines. Accepted implementation, 13 October 2026 One looping water voice uses proximity to the accepted sampled island and opposite-bank contours. Initial reach is 240 world pixels with eased response. The source has a minimal 0.8-second loop crossfade; no arbitrary duration extension or geography changes. Christiaan accepted the river sound and blending in the final human listening..."},{"id":"F10-US05","title":"Smooth Local Ambient Blending","status":"Complete","summary":"As a player, I want ambient layers to blend gradually as my surroundings change so that audio reinforces local geography without obvious invisible sound-zone boundaries. Approved direction Respond to the Wanderer's actual local position, combining woodland influence, actual shoreline proximity and a modest northeast-quarry influence. These influences overlap rather than selecting exclusive zones. Meadow to woodland: more foliage and bird activity, with less grasshopper emphasis. Woodland beside the river: retain vegetation influence while water increases near the bank. Meadow/woodland to quarry: slightly more exposed wind and less wildlife. Moving inland reverses shoreline water blending. Use smooth fades at both normal and faster developer movement speeds. Keep update frequency modest and reuse accepted F18 shore contours, authored grove hubs and the existing quarry footprint. A few reusable voices and a small scheduler are enough; no world generation, complex occlusion, weather,..."},{"id":"F10-US06","title":"Independent Audio Volume Controls","status":"Complete","summary":"As a player, I want to adjust environmental ambience, gameplay sound effects and music independently so that I can customize the game's audio balance. Acceptance criteria Three independent 0-100% volume settings: Ambient, Sound Effects and Music. Changes apply immediately with a short smooth fade; 0% fully mutes and 100% uses unity gain without amplification. Settings persist across game restarts. Separate Godot buses route environmental/wildlife audio and existing gameplay SFX to Master. Audio controls are accessible from the title and active gameplay, with a clear Back action and unobstructed gameplay when closed. Music bus is prepared; music playback is outside this bundle. Accepted implementation, 13 October 2026 The Audio button opens three sliders. Preferences use ConfigFile under user://audio_settings.cfg, with a 0.12-second gain fade. Defaults
