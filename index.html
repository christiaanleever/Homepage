are Ambient 60%, Sound Effects 100%, Music 100%. Gameplay controls stop while the panel is open and resume on Back/Escape. Existing..."},{"id":"F10-US07","title":"Starting Region Musical Identity & Soundtrack","status":"Playtesting","summary":"Approved first playback experiment, 16 October 2026 Internal, non-commercial soundtrack playtest using the supplied full recordings assets/audio/music/Flourish.mp3 and assets/audio/music/Grow.mp3. Both are Suno V6-Mini generations made under a free subscription, originally titled \"Cur Flourish\". Sources and release restrictions are authoritative in AUDIO_ASSETS.md. These are development references only, not approved for public or commercial release without appropriate rights or replacement. 1. New gameplay begins with environmental ambience only. The first discovered actual river-water cell inside the gameplay viewport starts Flourish, after a 3-second playable-session safeguard. Hidden/off-screen geometry and the parchment viewport cannot trigger playback. The trigger uses the existing exploration knowledge grid and gameplay veil visibility, including its blurred hint band when actual river water becomes visible (above 1% opacity). 2. Start both tracks at 0:00 directly at unchanged linear playback gain 0.16, with no fade-in, as selected by human listening. Play the full recording through its natural ending, without looping or an ending fade. 3. Wait a fresh randomized 420-720 seconds (7-12 minutes) of playable quiet time, then Grow, then Flourish, alternating with a new quiet interval every time. Exactly one voice prevents overlap and immediate repeats. 4. Parchment opening preserves gameplay/ambience pause. Existing music continues uninterrupted; encounter/quiet clocks pause and no new music starts until gameplay resumes. A track ending during the map enters quiet. 5. Drowning immediately fades music out over 0.35 seconds and stops it. Respawn starts ambience only and a fresh 7-12-minute interval. The first-river trigger is suppressed for that life, including drowning before any first encounter. 6. A fresh launch resets this session-only state. No save/load system changes. 7. Reuse the existing Music bus, sliders, mute and persisted settings. Gain, drowning fade, initial safeguard and silence bounds are tunable in scripts/music_playback.gd. Existing ambience/SFX balance remains unchanged. Scope and acceptance Developer controls refinement, 16 October 2026: human listening selected immediate playback without a fade-in. The A/B dropdown and Replay Flourish control are removed. Play Music starts/restarts Flourish from 0:00 on the existing single player independently of river visibility, including after respawn. Grow remains next after the normal randomized silence. Stop music immediately stops playback and suppresses all automatic starts until Play Music is pressed or a fresh gameplay session starts, including across drowning and respawn. Neither action changes discovery knowledge or the independent 0.35-second drowning fade-out. The buttons stay available in the Developer panel; Audio still has only its three existing sliders. F10-US07 stays Playtesting, pending final human acceptance. This first experiment implements exploration playback only. The broader warm, peaceful, slightly adventurous musical direction remains: complement natural ambience, leave substantial silence and keep gameplay effects audible. Building music, discovery cues, new UI, priorities and a dynamic music framework are outside this implementation. The three intended future moods remain peaceful island exploration, restrained mysterious discoveries and comforting home-building. Automated validation covers both recordings, river visibility gating, fades, random intervals, alternation, map pause, volume/mute/persistence and drowning/ respawn. Timers are advanced and recordings seek near their endings in tests; this is not a full-duration human listening test. Human listening must approve musical fit, gain, complete natural endings and the quiet pacing before Complete. Public/commercial use additionally requires suitable rights or replacement. F10-US01 and F10-US03 through F10-US06 retain their statuses; BUG-006 remains Open and deferred. F03-US26 remains Complete. Longer-term musical direction, retained for future work The game already has an accepted natural environmental soundscape consisting of wind, birds, insects and river sounds. The soundtrack should complement this soundscape rather than compete with it. Music should not play continuously throughout gameplay. Quiet periods with only natural environmental ambience are an important part of the intended experience. The soundtrack should reinforce three emotional situations: A. Exploring the starting island - Occasional gentle, melodic instrumental music. - Warm, peaceful and slightly adventurous. - Evoke curiosity and the pleasure of exploration. - Allow substantial intervals when only environmental ambience plays. - Avoid making ordinary movement feel artificially dramatic. B. Discovering something mysterious - Restrained musical cues for selected meaningful discoveries. - Examples may include encountering mysterious ancient ruins or other important exploration moments. - Suggest wonder, curiosity and the possibility of something hidden. - Avoid overly dramatic stingers or musical announcements that reveal secrets prematurely. - Not every discovery or landmark needs a musical cue. C. Building a home - Occasional warm, comforting instrumental music. - Reinforce the feeling of slowly transforming wilderness into a home. - Cozy, hopeful and satisfying. - Avoid cheerful music becoming repetitive or distracting during prolonged crafting and building. Musical identity Prefer a coherent and recognizable musical identity for Beyond the River over generic royalty-free fantasy background music. The musical style should support: - Natural surroundings. - Peaceful exploration. - Mystery and discovery. - A sense of adventure. - Cozy building and progression. - Emotional warmth. Music should feel appropriate for a commercial indie game and consistent with the North Star visual direction. Exact instruments, composition style, themes, track lengths and musical structure are not yet approved. These should be explored during the future soundtrack design phase. We may evaluate original compositions, appropriately licensed existing music, or AI-assisted composition, considering commercial rights, musical consistency, quality and production costs. The first experiment above authorizes only the two supplied internal reference tracks; future asset selection remains separately scoped."},{"id":"F10-US08","title":"Menu Music & Music Loop Preference","status":"Backlog","summary":"Scope: Future release audio; production/licensing separate. Approved future design, not current POC implementation. Acceptance criteria for future implementation Start-menu music is distinct but stylistically related to the game soundtrack and uses the accepted Music volume control and bus. Add a persistent Loop Music option, default off. Ordinary gameplay background music may repeat when enabled. Significant discovery cues and cinematics must not loop merely because Loop Music is enabled. Preserve smooth transitions, intended quiet periods and natural ambience. Retain F10-US06 controls and F10-US07 musical identity. Current F10-US07 non-looping internal experiment remains in Playtesting; this future preference does not change its current playback or clear its music for release."}]},{"id":"F11","title":"Maps, Cartography & Zone Structure","description":"","stories":[{"id":"F11-US01","title":"Substantial Zone Scale","status":"Retired","summary":"Zone scale is a planning principle rather than a standalone implementation task. The approximate 10 x 10 gameplay-screen heuristic remains flexible in World Design section 5.8, not a fixed technical dimension or completed zone requirement."},{"id":"F11-US02","title":"Parchment-Style Zone Map","status":"Complete","summary":"Owner acceptance, 14 October 2026: the current starting-island map is functionally complete and sufficient for the initial Steam demo. M toggles the full-screen map; M, Escape or X closes it. Three resolution-aware zoom levels, synchronized vertical zoom controls and bounded dragging are accepted. Every opening resets to the closest level centered on the player; full overview disables dragging. Paper texture and cartographic layers share one map-space transformation. Gameplay and audio pause while open."},{"id":"F11-US03","title":"Exploration Reveal on Zone Maps","status":"Complete","summary":"Owner acceptance, 14 October 2026: shared discovery-based gameplay visibility and parchment reveal are complete for the starting-island demo. Exploration records independently of camera zoom and map usage. Unknown gameplay is black with the accepted soft hint band; unknown map territory is blank sepia parchment and discovered land has the accepted green wash. Ordinary radius is 300 world pixels; geography-aware water sight extends up to 400, with up to 128 pixels inside a newly encountered opposite bank, never beyond the overall 400-pixel limit. It does not extend back into the original landmass. Developer Reveal Map/Show Unexplored changes presentation without rewriting discovery. Session knowledge is accepted; long-term save/load remains F11-US05. This story also owns the implemented gameplay exploration visibility; no separate duplicate story is required."},{"id":"F11-US04","title":"Simplified World Map","status":"Backlog","summary":""},{"id":"F11-US05","title":"Persistent Exploration Knowledge","status":"Ready for development","summary":"Session-level exploration knowledge already survives map closing/reopening, leaving an area and drowning/respawn. Long-term persistence/save/load remains outstanding and Ready for development, not Complete. No save architecture was introduced; previously revealed terrain should remain known."},{"id":"F11-US07","title":"Dynamic Cartographic Representation of World Changes","status":"Complete","summary":"Owner acceptance, 14 October 2026: dynamic trees, rocks, medium-tree weighting and landmark discovery are accepted for the demo. Live scene resource positions and depleted states drive stable local groves and intact/depleted rock groups. Ordinary trees contribute one density unit; medium trees contribute five once to the shared grove budget, with larger illustrations replacing small-symbol slots. Harvested trees leave active cartography; quarry geology remains after rock exhaustion. Resource/discovery events update cached local content even while the map is closed; opening displays current data without ongoing hidden rendering. Symbols respect land, discovery and authored bounds. Further artwork polish is deferred to F11-US08."},{"id":"F11-US08","title":"Optional Cartographic Artwork Polish","status":"Backlog","summary":"As a player, I want optional later improvements to cartographic illustration quality so that the map can develop a richer hand-drawn identity while remaining accurate and dynamic. The procedural parchment map is accepted for the initial Steam demo. This is future visual polish, not a blocker for F11-US02, F11-US03 or F11-US07. Possible directions include illustrated tree/forest assets, more artistic cliff/beach/rock symbols, more organic paper/terrain treatment and a hybrid of artwork assets with live world-derived geography and resources. Exact assets and production treatment remain future decisions under the Visual Production Specification. Acceptance criteria for future implementation An approved visual comparison demonstrates the selected illustration improvements at all three map scales. Geographical accuracy, dynamic depletion, discovery masking, unified transformations and accepted responsiveness remain intact. Detailed asset requirements stay in the Visual Production..."}]},{"id":"F12","title":"Trading, Economy & Settlements","description":"Approved future direction is a hybrid barter and currency economy. Simple barter with the optional traveller may be demo stretch; full currency, shops and settlements primarily belong to the full game. Neither trade nor barter is required for the boat mystery. Ordinary trading/NPC interaction is local and does not depend on F16 generative AI or online services. Precise currency form, balance and Hardcore currency loss remain undecided.","stories":[{"id":"F12-US01","title":"Basic NPC Trade Interaction","status":"Backlog","summary":"Scope: Optional Steam-demo stretch for traveller; full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Provide understandable contextual NPC trade interaction, coordinated with F19 friendly interaction. Keep the boat mystery completable without trade or barter."},{"id":"F12-US02","title":"Barter and Special Item Exchanges","status":"Backlog","summary":"Scope: Optional Steam-demo traveller stretch; full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Allow simple barter and special item exchanges alongside the eventual currency economy. Exact trades and balance are undecided. Honour F04-US12 progression-item protection; do not reveal hidden boat solutions."},{"id":"F12-US03","title":"Currency and Wallet Support","status":"Backlog","summary":"Scope: Primarily full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Support a currency wallet in the hybrid economy and persist it through F15-US03. Currency form, balance and Hardcore death treatment remain unresolved; do not silently apply an item-loss policy to currency."},{"id":"F12-US04","title":"Buying and Selling","status":"Backlog","summary":"Scope: Primarily full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Support buying and selling within the hybrid economy, with understandable quantities and transactions. Respect F04-US12 protection against progression-softlocking sales. Exact prices and balance remain undecided."},{"id":"F12-US05","title":"Specialized Merchants and Services","status":"Backlog","summary":"Scope: Full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Use distinctive merchants and useful services when designed; do not invent a required merchant roster, service list or boat dependency."},{"id":"F12-US06","title":"Handcrafted Settlements","status":"Backlog","summary":"Scope: Full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Create distinctive handcrafted settlements with shops and local character. Selectively evolving details may be considered later; no complex procedural settlement simulation is committed."},{"id":"F12-US07","title":"Potential Regional Trading Differences","status":"Backlog","summary":"Scope: Speculative full-game possibility. Approved future design, not current POC implementation. Acceptance criteria for future implementation Regional trading differences may later support exploration and local identity. This is speculative, not a commitment to regional markets or simulation."}]},{"id":"F13","title":"Day, Night, Rest & Environmental Systems","description":"Day/night is optional Steam-demo stretch. If selected, first bundle F13-US01 through US03, then playtest before adding complexity. No mandatory hunger, exhaustion, harsh survival loop or production-scale weather simulation. Coordinate time audio with F10, routines with F19 and future respawn/rest points with F08/F14.","stories":[{"id":"F13-US01","title":"World Time and Configurable Day/Night Cycle","status":"Backlog","summary":"Scope: Optional Steam-demo stretch. Approved future design, not current POC implementation. Acceptance criteria for future implementation Provide configurable world time/day-night cycling with explicitly defined pause behaviour. Exact cycle duration and pause policy require design before implementation."},{"id":"F13-US02","title":"Gradual Warm Daylight Transitions","status":"Backlog","summary":"Scope: Optional Steam-demo stretch. Approved future design, not current POC implementation. Acceptance criteria for future implementation Blend daylight gradually while retaining the approved warm North Star / Concept A visual identity and readable terrain."},{"id":"F13-US03","title":"Comfortable Night Exploration","status":"Backlog","summary":"Scope: Optional Steam-demo stretch. Approved future design, not current POC implementation. Acceptance criteria for future implementation Keep night navigation comfortable and readable without mandatory torches. Test US01 through US03 together before increasing complexity."},{"id":"F13-US04","title":"Optional Sleep, Rest and Camping","status":"Backlog","summary":"Scope: Later optional scope. Approved future design, not current POC implementation. Acceptance criteria for future implementation Sleeping/resting is optional, with potential camping alternatives. No mandatory exhaustion or survival loop. Coordinate future rest/respawn-point improvements with F08 and F14; exact mechanics remain undecided."},{"id":"F13-US05","title":"Time-of-Day Audio Blending","status":"Backlog","summary":"Scope: Later optional scope, depends on time cycle. Approved future design, not current POC implementation. Acceptance criteria for future implementation Blend appropriate time-of-day ambience through F10 without replacing accepted volume controls or musical identity."},{"id":"F13-US06","title":"Rain and Broader Weather","status":"Backlog","summary":"Scope: Future full-game direction. Approved future design, not current POC implementation. Acceptance criteria for future implementation Consider future rain and broader weather conditions without committing to production-scale weather simulation or mandatory survival systems."},{"id":"F13-US07","title":"Time-Dependent NPC and Creature Routines","status":"Backlog","summary":"Scope: Later scope, coordinated with F19. Approved future design, not current POC implementation. Acceptance criteria for future implementation Add understandable time-based local routines only after the time system and actors justify them. Keep ordinary interaction accessible and independent of F16 external AI."},{"id":"F13-US08","title":"Potential Seasons","status":"Backlog","summary":"Scope: Speculative, potentially expensive full-game scope. Approved future design, not current POC implementation. Acceptance criteria for future implementation Seasons are a possibility to evaluate later, not committed demo scope or an approved production asset programme."}]},{"id":"F14","title":"Difficulty Modes, Death & Hardcore","description":"Approved full-game modes are Explorer (gentler combat), Adventure (default standard combat), and Hardcore (Adventure combat with meaningful ordinary carried/equipped item loss). Hardcore is not permadeath. The Steam demo uses Adventure only; no initial difficulty-selection menu. Current POC drowning/respawn and F03-US29 Playtesting are distinct from this future design.","stories":[{"id":"F14-US01","title":"Explorer, Adventure and Hardcore Modes","status":"Backlog","summary":"Scope: Full game; demo Adventure only. Approved future design, not current POC implementation. Acceptance criteria for future implementation Explorer has gentler combat. Adventure is standard/default. Hardcore uses the same combat difficulty as Adventure, with item-loss consequences instead of permadeath. Do not require a difficulty-selection menu for the initial Steam demo."},{"id":"F14-US02","title":"Safe Respawn and Permanent Progression","status":"Backlog","summary":"Scope: All future modes; demo standard safety. Approved future design, not current POC implementation. Acceptance criteria for future implementation Respawn safely and preserve permanent progression, XP, levels, discoveries, world modifications, buildings and securely stored items in all modes. Adventure retains items on defeat. Coordinate future improved respawn points with F08 and F13."},{"id":"F14-US03","title":"Hardcore Backpack and Equipped Item Loss","status":"Backlog","summary":"Scope: Full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation On Hardcore death, lose unprotected backpack items and equipped items. Equipped status alone provides no protection. Use developer-controlled item-level keep_on_death, default false, consistently with F04-US12. Currency loss remains undecided."},{"id":"F14-US04","title":"Progression Protection and Tool Recovery","status":"Backlog","summary":"Scope: Full-game Hardcore safety; shared recovery capabilities. Approved future design, not current POC implementation. Acceptance criteria for future implementation Critical unique puzzle/quest objects must be protected or reliably recoverable; intended puzzle consumption remains valid under F04-US12. F04-US11 tool-free Wood gathering must allow rebuilding essential basic tools, including after nearby resources were harvested. F04-US13 persistent chest contents remain safe from character death."},{"id":"F14-US05","title":"Authoritative Hardcore Save Timeline","status":"Backlog","summary":"Scope: Full game; unresolved detailed UX. Approved future design, not current POC implementation. Acceptance criteria for future implementation F15-US03 save/load must prevent trivial rollback of death losses, while supporting the ordinary manual/automatic save design. Define authoritative timeline and recovery/backup/manual-load UX before implementation; do not invent a save-locking solution here."},{"id":"F14-US06","title":"Mode Selection and Persistence","status":"Backlog","summary":"Scope: Full game. Approved future design, not current POC implementation. Acceptance criteria for future implementation Select and persist player mode per future playthrough design. Whether switching modes is permitted remains undecided. Coordinate with F15 saves/menus. Exact currency-loss policy is also unresolved."}]},{"id":"F15","title":"Steam, Release & Playtesting Infrastructure","description":"Prepare Beyond the River for external playtesting and eventual Steam release. A curated public development trail can reward curious players, and the public backlog and community guides may discuss gameplay secrets and solutions.","stories":[{"id":"F15-US01","title":"Multi-Resolution and Display Mode Support","status":"Backlog","summary":"Future common Windows resolutions, 16:9/16:10, sensible ultrawide behaviour, windowed/fullscreen/borderless modes, responsive HUD anchoring, authored composition preservation and crisp pixel scaling. Camera zoom remains a separate concern."},{"id":"F15-US02","title":"Curated Public Development Archive / External Discovery Layer","status":"Backlog","summary":"Give curious players publicly discoverable development traces that confirm deeper secrets and a real river-crossing solution exist. Near Steam release, the approved curated page may be searchable by game and developer name, keep its own clues high-level and feel like a genuine development archive. It may confirm boat crafting and the opposite-bank completion condition. Gameplay spoilers, solutions and development hints may be shared in the public development backlog and elsewhere. Exclude genuine confidential information and inaccessible private links. Replace the detailed public backlog with the approved curated archive near Steam release. Search indexing is a publication preference. Exact copy, clue density, structure, styling and timing are future release-design work."},{"id":"F15-US03","title":"Persistent Save, Load & Continue","status":"Backlog","summary":"Scope: Steam-demo release core; future Hardcore compatibility. Approved future design, not current POC implementation. Acceptance criteria for future implementation Support manual saving and autosave enabled by default, with separate manual saves and rotating autosave snapshots per playthrough. Autosave must not overwrite manual saves. Initial tuning target: approximately every two minutes when progress changed, plus event-based saves and safe-exit behaviour. Start with two rotating autosave backups provisionally. Persist meaningful character, inventory/equipment, F07 progression, F08 construction, F04 storage, resources, recipes/discoveries/puzzle states, F11 exploration and F09 completed-ending state. Restore valid locations without duplication or corruption. Use versioned save data, safe writes and recovery procedures; work fully offline. F09 Return Home depends on reliable persistence. Future Hardcore needs an authoritative timeline preventing trivial death-loss rollback despite manual saving; detailed UX is unresolved."},{"id":"F15-US04","title":"Main Menu, Pause Menu & Session Management","status":"Backlog","summary":"Scope: Steam-demo release core. Approved future design, not current POC implementation. Acceptance criteria for future implementation Main menu: New Game, Continue Current Game, Load Game, Settings and Quit. ESC menu: Resume Game, Save Game, Load Game, Settings and Return to Main Menu. Continue loads the latest valid state of the selected playthrough. Save selection presents understandable identifying information. New Game must not silently overwrite progress. Destructive save operations require appropriate confirmation. Return to Main Menu differs from F09 Return Home after the ending. Integrate future start-menu music through F10-US08."},{"id":"F15-US05","title":"Standalone Windows Builds & Steam Demo Packaging","status":"Backlog","summary":"Scope: Private alpha then Steam-demo release. Approved future design, not current POC implementation. Acceptance criteria for future implementation Produce versioned standalone Windows builds; validate launch, controls, audio, visuals, cinematics where included, saving and clean exit. Ordinary play requires no Godot editor, Codex or internet connection. Disable release-inappropriate developer overrides. Verify commercial rights for distributed assets. Current internal Suno music is not cleared for a public/commercial demo; follow AUDIO_ASSETS.md. Steam packaging and platform-specific integration remain later release tasks. Verify in a real Windows export that Developer controls are absent and normal water hazards apply. This remains pending after F15-US08 acceptance."},{"id":"F15-US06","title":"Release Validation & External Playtest Acceptance","status":"Backlog","summary":"Scope: Steam-demo release core. Approved future design, not current POC implementation. Acceptance criteria for future implementation Test island enjoyment without finding the ending, successful boat discovery/crossing/completion, Return Home, save/load and cross-session persistence. Validate progression/inventory states, regular water hazards with developer overrides disabled, display, controls, audio and performance. Triage blocking defects separately from accepted minor issues, preserve public mystery secrecy and require human playtest acceptance before release."},{"id":"F15-US07","title":"Private Alpha Distribution, Logs & Player Feedback","status":"Backlog","summary":"Scope: Private alpha may precede complete Steam demo. Approved future design, not current POC implementation. Acceptance criteria for future implementation Provide versioned privately shareable standalone Windows alpha builds for trusted family/friends, fully playable offline. Provide an in-game bug/suggestion entry point, locally saved exportable feedback, relevant technical logs and game-version information for voluntary sharing. No silent transmission of diagnostics, gameplay or personal data; avoid unnecessary personal information. Online feedback infrastructure is a later option. Do not expose confidential developer controls or hidden mystery solutions. Private alpha does not imply all Steam-demo features are complete."},{"id":"F15-US08","title":"Developer Panel Usability & Release Isolation","status":"Complete","summary":"The grouped Developer panel uses consistent controls and shows active speed, map and Instant Harvest states. Local Godot editor play retains the overrides. Exports omit the Developer controls and use normal Drown mode. Player Audio remains separate. Christiaan accepted all eight human visual and functional checks on 11 November 2026. Earlier automated validation passed 424 checks. Real Windows export validation remains under F15-US05."}]},{"id":"F16","title":"AI-Driven Living World & NPC Intelligence","description":"Use AI selectively to make creatures, enemies, companions and NPCs respond to the full context around them instead of relying only on rigid scripted reactions.","stories":[{"id":"F16-US01","title":"Contextual Actor Decision Contract","status":"Backlog","summary":"As a developer, I want AI-assisted actors to use a small structured decision contract so that external intelligence can be added without surrendering game authority. Intent Godot supplies structured context and the currently valid actions. The decision layer returns one valid action plus optional structured reasoning metadata. Godot validates and executes the result. Do not build this interface before there is a real actor prototype that needs it."},{"id":"F16-US02","title":"Deterministic Local Fallback Behaviour","status":"Backlog","summary":"As a player, I want creatures and NPCs to remain functional without an online AI service so that Beyond the River remains playable offline and resilient to service failures. Intent Build ordinary local behaviour first. Timeouts, errors, rate limits or offline play fall back immediately to local logic. External AI may enrich behaviour but must never be required for basic game continuity."},{"id":"F16-US03","title":"Jev Wolf Experiment","status":"Backlog","summary":"As a developer/playtester, I want one deliberately small wolf experiment so that we can judge whether contextual AI decisions are actually more believable and fun than conventional rules. Intent Start only after a basic local wolf behaviour exists. Initial context should stay small, roughly 8 to 12 relevant facts such as: health hunger player distance player health nearby player allies nearby wolf allies player has fire escape route available recent damage previous encounter day/night where relevant Initial valid actions: ATTACK RETREAT CIRCLE THREATEN HOLD Compare AI-on and local-fallback encounters under controlled circumstances. Measure actual latency and behaviour quality rather than relying on vendor claims."},{"id":"F16-US04","title":"Event-Driven Decision Triggers","status":"Backlog","summary":"As a player, I want actors to reconsider their behaviour when meaningful circumstances change so that reactions feel timely without turning moment-to-moment gameplay into network calls. Intent Possible triggers include: player enters detection range player draws a weapon or lights fire actor takes significant damage allies or enemies arrive actor becomes cornered target becomes badly wounded line of sight is lost relationship or memory changes Movement, animation, collision and immediate combat mechanics remain local conventional game code."},{"id":"F16-US05","title":"Explainable Actor Behaviour","status":"Backlog","summary":"As a player, I want unusual creature and NPC decisions to have understandable contextual clues so that intelligent behaviour feels learnable rather than random. Intent Preferred default is subtle explanation, for example: *Outnumbered and wary of your torch, the wolf retreats.* Do not normally show raw model probabilities. A future setting may allow explanations to be Off, Subtle or Detailed."},{"id":"F16-US06","title":"Learned Creature Knowledge","status":"Backlog","summary":"As an exploring player, I want repeated observations to teach me how creatures tend to behave so that understanding the world becomes a form of progression. Intent A future journal or bestiary may record observations only after the player has actually experienced them, such as wolves being cautious around fire or injured animals retreating more often. The loop should be: Observe -> Understand -> Predict -> Manipulate circumstances -> Observe a new response"},{"id":"F16-US07","title":"Persistent Actor Context & Memory","status":"Backlog","summary":"As a player, I want important NPCs and selected creatures to remember relevant previous encounters so that later decisions can reflect what has actually happened. Intent Potential context includes: trust fear prior help or betrayal injuries witnessed events relationships reputation Memory should remain curated and game-relevant rather than storing an uncontrolled transcript of everything."},{"id":"F16-US08","title":"AI-Assisted NPC & Companion Decisions","status":"Backlog","summary":"As a player, I want companions and NPCs to make contextual choices so that trust, danger, personality and past events can matter to what they are willing to do. Intent Examples may include FOLLOW, HELP, WAIT, WARN_PLAYER, REFUSE, RETREAT, PROTECT_PLAYER or PROTECT_SELF. Apply this only after the smaller creature-decision experiment has demonstrated value."},{"id":"F16-US09","title":"Lore-Constrained Dynamic NPC Dialogue","status":"Backlog","summary":"As a player, I want selected NPCs to express their already-made decisions naturally so that conversations can feel personal without allowing a language model to rewrite game truth. Intent Dialogue generation may use: NPC identity and personality permitted world knowledge current emotional state memories and relationships location and era the decision already authorized by Godot A language model may describe or explain an action, but Godot still decides whether that action can actually occur."},{"id":"F16-US10","title":"Secure AI Service Integration","status":"Backlog","summary":"As a developer, I want external AI calls to use a protected service layer so that production credentials, costs and reliability can be controlled safely. Intent A future BTR service may handle: credential protection rate limits cost controls caching where appropriate logging and observability request validation timeouts provider fallback Do not embed production API secrets directly in the released Godot executable."},{"id":"F16-US11","title":"Living-World Decision Systems","status":"Backlog","summary":"As a player, I want the broader world eventually to react to changing circumstances so that factions, encounters and settlements can feel alive beyond individual NPC conversations. Intent Possible later decisions include: EXPLORE FORTIFY TRADE HUNT MIGRATE HIDE RETALIATE This is deliberately late scope. Do not build higher-level simulation until smaller actor-level systems have proved useful in play. Success criterion The feature succeeds when players describe understandable contextual reactions, for example: \"I thought he was going to attack me, but then he saw who I was travelling with and backed off.\" rather than describing the system as random AI or as a fixed aggression-radius script."}]},{"id":"F17","title":"AI-Assisted Development, Autonomous QA & Content Production","description":"Use AI not only to implement individual tasks, but to reduce the repetitive human supervision currently required between implementation, validation, critique and repair.","stories":[{"id":"F17-US01","title":"Trial Builder-Reviewer-Repair Loop","status":"Complete","summary":"As a developer, I want one normal BTR implementation task to use an internal Builder and independent Reviewer so that we can measure whether the workflow catches issues without requiring Christiaan to manually start every review pass. Intent For one suitable medium-sized task: 1. Builder implements the requested scope. 2. Builder runs the normal required validation and captures evidence. 3. A separate Reviewer inspects the implementation against the acceptance criteria. 4. Reviewer identifies only material issues, regressions or unmet criteria. 5. Builder repairs those issues. 6. Reviewer rechecks. 7. Repeat for a maximum of three repair cycles. 8. Stop early as soon as the work passes. 9. If material issues remain after the limit, stop and report them for human review. Do not automatically start another backlog item after the task is accepted. Trial result The workflow was successfully trialled on a suitable implementation and completed in one Builder/Reviewer round with..."},{"id":"F17-US02","title":"Evidence-First Independent Review","status":"Backlog","summary":"As a developer, I want the Reviewer to reuse the Builder's evidence before repeating expensive work so that independent QA adds confidence without unnecessarily multiplying usage. Intent Reviewer input should normally include: requested scope and acceptance criteria changed files / diff automated-test output runtime logs screenshots or capture sheets where relevant known limitations The Reviewer should rerun a test only when independent verification is valuable."},{"id":"F17-US03","title":"Option B Directed Zone Production","status":"Backlog","summary":"As a creative director, I want AI to produce most ordinary assets, placement and implementation for one future full zone while I direct the biome, landmarks, gameplay identity and overall quality so that we establish a scalable content-production method. Intent Christiaan should approve the zone direction, not every ordinary tree, rock or grass sprite. The zone brief should define at minimum: biome/theme mood/reference major landmarks traversal openness important resources and creatures unique discoveries or story hooks visual and performance acceptance criteria AI may create the broader reusable asset family and world dressing within those constraints. This work is deferred until after the starting-island demo milestone unless the project explicitly changes scope."},{"id":"F17-US04","title":"Reference Zone as Production Standard","status":"Backlog","summary":"As a developer, I want the accepted Option B zone to become a concrete production reference so that later agents can imitate a real BTR-quality result rather than interpreting written rules alone. Intent The reference zone should teach later production through: accepted asset density visual resolution and texture detail traversal composition landmark spacing ecological clustering collision conventions environmental storytelling resource distribution screenshot/capture examples measurable technical constraints Do not duplicate every detail into multiple documents; keep one authoritative zone-production specification and link to the accepted reference."},{"id":"F17-US05","title":"Option C Autonomous Zone Experiment","status":"Backlog","summary":"As a developer, I want AI to create one later zone with substantially less human intervention so that we can measure whether autonomous production can approach the quality of the human-directed reference zone at much lower effort. Intent Give the system: the accepted Option B reference zone authoritative BTR design documents a new biome brief acceptance criteria Builder/Reviewer repair loop maximum repair cycles Then avoid human intervention until the autonomous attempt is complete. Compare against Option B on: visual coherence gameplay quality technical defects traversal quality content richness time/usage spent amount of human correction required"},{"id":"F17-US06","title":"Limited Multi-Agent Development Orchestration","status":"Backlog","summary":"As a developer, I want an optional lightweight orchestrator only if the single-task experiment proves valuable so that future work can move through Builder, Reviewer and repair states without manual prompting. Intent Do not build a separate orchestration system merely because it is technically interesting. Consider it only when: repeated Builder/Reviewer tasks demonstrably save human effort manual agent handoffs are becoming a real bottleneck the project has enough repeated production work to justify automation The initial orchestrator should remain simple and bounded rather than becoming a second software project."},{"id":"F17-US07","title":"Human Acceptance Gate","status":"Backlog","summary":"As a creative director, I want autonomous development to stop at a clear human acceptance gate so that AI can remove repetitive QA work without silently deciding whether the game is enjoyable or commercially ready. Intent Agents may validate: implementation correctness acceptance criteria regressions obvious visual defects consistency with references technical quality Human playtesting still decides: whether the result feels fun whether the visual quality is good enough whether the result feels like Beyond the River whether the feature/zone is accepted whether the project should continue into the next major scope"}]},{"id":"F18","title":"Starting River Region & Water Experience","description":"Transform the starting area from a mechanically functional island surrounded by water into a convincing, beautiful starting region where the player clearly inhabits a large natural island inside a broad, continuous freshwater river.","stories":[{"id":"F18-US01","title":"Redesign the Starting Region as a True River Island","status":"Complete","summary":"As a player, I want the starting island to sit inside a broad river that clearly flows through a larger world so that the title and geography immediately promise somewhere meaningful beyond the water. Intent replace the circular/moat-like composition with a confident new topology broadly orient the river northwest to southeast, allowing a close diagonal variation if it reads more naturally let the river split around the island and continue off-map in both directions vary channel width and opposite-bank distance allow the island to become somewhat elongated and strongly irregular avoid circles, ovals, symmetrical bean shapes, uniform water gaps and obvious procedural polygons prefer projections, recesses, natural bends, longer bank stretches and one pronounced rocky mini-cove preserve the island as a genuine island rather than turning it into a peninsula let the exact outline be designed during implementation from this language rather than manually specifying every coordinate Phase..."},{"id":"F18-US02","title":"Establish Interwoven Shoreline Geography","status":"Complete","summary":"As a player, I want varied shoreline conditions to recur naturally around the island so that the river edge feels handcrafted rather than divided into obvious biome sectors. Approved language Use four interwoven shoreline families: grassy / damp-earth bank sand / mud bank rocky bank short rock ledge / cliff Loose composition guidance: approximately 45% grassy / damp approximately 30% sand / mud approximately 15% rocky approximately 10% cliff / ledge These are art-direction proportions, never hard quotas. Around 80% of the perimeter should feel intentionally authored and visually interesting, but richness should come from variation and layering rather than uniform prop density. Quiet stretches provide breathing room. Do not create obvious north/east/south/west shoreline sectors. Materials should recur and blend around the island. Include one prominent recessed rocky mini-cove on the starting island, framed by rocky shoulders and suitable for broad future shallows. It is an..."},{"id":"F18-US03","title":"Define Traversable Shoreline Types","status":"Complete","summary":"As a player, I want shoreline appearance to tell me naturally where I can enter the river so that traversal restrictions match what I see. Approved rules sand / mud shoreline: enterable grassy / damp-earth bank: enterable rocky shoreline: normally non-enterable in the first pass cliff / rock ledge: non-enterable collisions should correspond to visible geography deliberate exceptions may be authored later without undermining the basic visual language Accepted F18 POC exception: rocky banks now use individual fitted rock collision; visible gaps permit entry where safe depth geography supports it. Cliffs retain blocking faces. This is the accepted current implementation, rather than a continuous invisible rocky strip. Phase C.1 adds visible gravel/rock masses at blocked banks and reed/grass or sediment detail at soft banks. Phase B collision and access rules are unchanged."},{"id":"F18-US04","title":"Establish Graduated River Depth","status":"Complete","summary":"As a player, I want increasing water depth to be communicated before lethal deep water so that drowning feels understandable rather than like an abrupt transition from ankle-deep safety to instant death. Player-facing depth states Clear shallow safe accepted movement multiplier remains 0.70 riverbed strongly visible submerged stones relatively crisp lighter water feet / lower legs visually submerged Mid-shallow / deep wading safe transitional warning state first playtest value approximately 0.40 movement multiplier riverbed remains visible but becomes more muted richer / deeper water colour player appears submerged approximately to waist level stronger wading disturbance may reinforce the warning Deep riverbed effectively disappears darker / richer water remains visually attractive existing release-facing drowning behaviour applies Hard transition rule Any player-accessible shallow-to-deep route must contain a mid-depth warning transition. It may become narrow where geography..."},{"id":"F18-US05","title":"Create Organic Water-Depth Geography","status":"Complete","summary":"As a player, I want shallow and deeper water to form natural local spaces rather than concentric bands so that the river feels shaped by real geography. Intent Do not create the shallow/deep boundary by uniformly offsetting the land shoreline. Use an independently irregular depth shape with broad patches, recesses, tongues, narrow necks, fragmented rocky shallows, locally compressed transitions and broad sandy shelves. Typical tendencies: grass/damp bank: narrow-to-medium shallows, sometimes broader sand/mud: strongest candidate for medium/broad shallows and visible submerged sandbanks rocky bank: narrow/fragmented shallows cliff/ledge: effectively no ordinary traversable shallow shelf, while any player-accessible route still preserves the warning language There must be no complete shallow-water ring that lets the player walk around the entire island offshore. Deep water remains the meaningful continuous crossing barrier. Codex should design actual depth geography from these rules..."},{"id":"F18-US06","title":"Recompose Starting-Island Objects and Landmarks","status":"Complete","summary":"As a player, I want the redesigned island to remain naturally populated and mechanically coherent so that changing the land shape does not leave objects floating in water or new land feeling unfinished. Phase A guardrails Whenever island shape changes, revalidate all placed world objects against the new geography. Hard requirements: no tree accidentally stands in water no ordinary land rock or harvestable land resource accidentally sits in water no land decoration floats beyond shoreline unintentionally no important resource becomes unreachable because land underneath it changed no newly created land is left obviously empty navigation/collision continues to correspond to visible geography Implementation may reposition trees, rocks, vegetation, the starting chest and other decoration; remove or add modest amounts where composition requires it; and rebalance exact resource counts later. Existing counts are not sacred for the topology experiment. Do not reopen accepted harvesting..."},{"id":"F18-US07","title":"Establish Convincing River Surface Motion","status":"Complete","summary":"As a player, I want calm river water to have perceptible continuous movement so that it feels alive and like water that is going somewhere. Intent a stationary player should notice within roughly two seconds that open water is moving motion should remain calm rather than oceanic or spectacular subtle directional drift may reinforce the larger river direction use lightweight systematic techniques for broad movement combine mostly quiet/static surface detail with a smaller amount of visibly moving highlight do not simulate detailed currents or hydrodynamics around the island do not hand-author unique animation across the whole river Phase C.1 narrows the existing moving surface marks and shifts them toward small cool highlights. The current POC appearance is accepted; future art refinements remain deferred."},{"id":"F18-US08","title":"Improve Shoreline and Wading Interaction Feedback","status":"Complete","summary":"As a player, I want water to visibly interact with riverbed, shoreline objects and my character so that entering the river feels physical rather than like walking over blue terrain. Visual stack Aim for: 1. submerged riverbed/ground continuing naturally beneath clear shallow water 2. lighter transparent shallow-water treatment 3. richer/deeper water treatment 4. soft irregular visibility/colour transition rather than a hard painted line 5. restrained static glints/highlights 6. systematic ambient surface motion 7. local lapping glints/ripple accents near selected rocks, reeds and shoreline 8. proper lower-body submersion/tint while wading 9. small player-created wake, fading ripples and occasional tiny step splashes Ordinary grass should generally stop at the wet bank rather than read as flooded lawn. Reeds, aquatic plants, sand, mud, gravel and stones may continue into shallow water. Rock-water continuity should support dry, partly wet/protruding and fully submerged readings...."},{"id":"F18-US09","title":"Preserve Opposite-Shore Curiosity","status":"Complete","summary":"As a curious player, I want selected viewpoints to reveal meaningful clues across the river so that the redesigned geography makes me want to find a way across. Phase A intent The ruin, closed chest and X remain opposite-bank curiosity anchors, but may move freely to fit the new river topology. ruin: visible from at least one reachable island-side viewpoint, mysterious, clearly across river chest: visible from island-side or safe-water viewpoint, tempting, unreachable through normal early movement X: has a comparatively close viewing position that does not require crossing a huge slow-water area; dry shoreline or very narrow safe water should be enough for a strong view rocky mini-cove: does not need to face any POI and may simply be a beautiful place River width may vary to create nearer and farther relationships. Opposite banks must read as continuation terrain rather than the inner wall of a circular arena."},{"id":"F18-US10","title":"Mysterious River Life","status":"Backlog","summary":"As a player, I want to occasionally notice subtle aquatic life beneath deeper water so that the river feels alive and makes me curious about future possibilities. Later direction An occasional fish or vague dark silhouette may: appear faintly in deeper water become more visible as it rises toward the surface travel briefly fade/disappear back into depth Keep appearances infrequent and mysterious. Do not imply or implement fishing, swimming, fish interaction or full wildlife simulation. This is later atmosphere scope and must not expand Phase A/B/C automatically."}]},{"id":"F19","title":"NPCs, Wildlife & Social Interaction","description":"Approved friendly interactions and passive wildlife use simple local behaviour and predefined dialogue. Ordinary NPCs do not require generative AI or online connectivity. F16 remains the separate deferred authority for dynamic AI-assisted behaviour/dialogue; F12 owns trading and F13 later time-dependent routines.","stories":[{"id":"F19-US01","title":"Contextual Friendly NPC Interaction","status":"Backlog","summary":"Scope: Steam-demo optional interaction content. Approved future design, not current POC implementation. Acceptance criteria for future implementation Contextual left-click approaches/interacts with friendly NPCs, consistent with the existing input language. Use local predefined behaviour without a generative-AI or internet dependency."},{"id":"F19-US02","title":"Sleepy Visiting Traveller","status":"Backlog","summary":"Scope: Steam-demo optional content. Approved future design, not current POC implementation. Acceptance criteria for future implementation A peaceful optional sleepy visiting traveller offers discoverable interactions. The player can complete the boat mystery without the traveller. Do not place an initial boat or dock on the untouched island to justify the visit."},{"id":"F19-US03","title":"Predefined Dialogue, Hints and World Flavour","status":"Backlog","summary":"Scope: Steam-demo optional content. Approved future design, not current POC implementation. Acceptance criteria for future implementation Use simple predefined dialogue, optional hints and world flavour without revealing hidden boat solutions. Do not invent approved lore or depend on F16 dynamic dialogue."},{"id":"F19-US04","title":"Resting, Dozing and Waking","status":"Backlog","summary":"Scope: Steam-demo optional traveller behaviour. Approved future design, not current POC implementation. Acceptance criteria for future implementation Support resting, dozing and waking without making interaction impossible. Coordinate later time-dependent routines with F13-US07; a full day/night system is not a prerequisite for simple local behaviour."},{"id":"F19-US05","title":"Passive River Ducks","status":"Backlog","summary":"Scope: Steam-demo optional wildlife content. Approved future design, not current POC implementation. Acceptance criteria for future implementation Place passive ducks around appropriate river areas, preserving calm exploration and the established ecology. No combat or online-AI requirement."},{"id":"F19-US06","title":"Later Traveller Boat Visits","status":"Backlog","summary":"Scope: Optional later stretch only. Approved future design, not current POC implementation. Acceptance criteria for future implementation Traveller boat visits may be explored later. They do not justify an initial boat or dock on the natural island and are not required for ordinary NPC interaction."}]}];
const BUGS=[{"id":"BUG-001","title":"Approaching a Clicked Tree Harvests an Intervening Tree","originalStory":"F03-US21","status":"Open","severity":"Non-blocking; priority not assigned.","evidence":"Reported while approaching a distant clicked tree, particularly travelling south to north. Exact scene location is not recorded.","github":"","summary":"Original story: F03-US21 Status: Open Severity/priority: Non-blocking; priority not assigned. Reproduction/evidence: Reported while approaching a distant clicked tree, particularly travelling south to north. Exact scene location is not recorded. Known non-blocking bug: When approaching a clicked distant tree, the Wanderer can harvest an intervening tree first, particularly while travelling south to north. Keep interaction associated with the selected tree; passing another harvestable must not silently retarget. If the target becomes invalid, fail or use a deliberately designed future retarget rule. Do not reopen accepted Phase 2 polish for this bug."},{"id":"BUG-002","title":"Cross-River Movement and Interaction Rejected Prematurely","originalStory":"F03-US22","status":"Open","severity":"Non-blocking; priority not assigned.","evidence":"Click an out-of-range opposite-bank harvestable or attempt a cross-river destination. Preserve the existing reported rejection and intended traversal scope below.","github":"","summary":"Original story: F03-US22 Status: Open Severity/priority: Non-blocking; priority not assigned. Reproduction/evidence: Click an out-of-range opposite-bank harvestable or attempt a cross-river destination. Preserve the existing reported rejection and intended traversal scope below. Known non-blocking bug: A left-click on an out-of-range opposite-bank harvestable can immediately say \"I can't reach that from here,\" and destination validation can reject a cross-river movement attempt. Right-click destinations and left-click targets across the river should start movement toward the selected place as far as traversal permits. With release-facing drowning enabled, the Wanderer should enter deep water and drown, not reject the attempt because the far endpoint is unreachable. The current developer override suppresses drowning for inspection. Future boat travel must not inherit an assumption that every opposite-bank target is invalid."},{"id":"BUG-003","title":"Harvest Drops Appear on the Wrong Riverbank","originalStory":"F03-US23","status":"Open","severity":"Non-blocking; priority not assigned.","evidence":"Under the previously reported testing conditions, harvesting an opposite-bank tree can place Wood in starting-island shallow water. Exact resource location is not recorded.","github":"","summary":"Original story: F03-US23 Status: Open Severity/priority: Non-blocking; priority not assigned. Reproduction/evidence: Under the previously reported testing conditions, harvesting an opposite-bank tree can place Wood in starting-island shallow water. Exact resource location is not recorded. Known non-blocking bug: Under current testing conditions, harvesting an opposite-bank tree can place Wood drops in starting-island shallow water. Resolve drops from the harvested object's actual world position so far-bank resources appear on or near the far bank, not from the player's side or an across-water approach point. This does not reopen accepted Phase 2 pickup art or behaviour."},{"id":"BUG-004","title":"Repeated Clicks Accelerate Harvesting","originalStory":"F03-US24","status":"Won't Fix","severity":"Accepted for now; severity/priority not assigned.","evidence":"The existing timed-click reproduction is retained below. Christiaan explicitly accepts somewhat faster harvesting from carefully timed repeated clicks.","github":"","summary":"Original story: F03-US24 Status: Won't Fix Severity/priority: Accepted for now; severity/priority not assigned. Reproduction/evidence: The existing timed-click reproduction is retained below. Christiaan explicitly accepts somewhat faster harvesting from carefully timed repeated clicks. Decision, 16 October 2026: Won't Fix, explicitly accepted by Christiaan. Carefully timed repeated clicks producing somewhat faster harvesting are acceptable for now. Reconsider only if duplicate rewards, material animation problems or major balance problems arise. This is not a claim that the old cadence requirements were implemented. The GitHub issue is not modified by this local documentation task. Historical report Type: Bug Tracked internally as BUG-004. As a player, I want harvesting cadence to remain consistent once an action has started so that repeatedly clicking the same target cannot speed up chopping or mining. Reproduction 1. Start harvesting a tree or rock with one left-click. 2. Let the normal swing -> impact -> swing sequence begin. 3. Immediately after an impact/chop/mine sound, left-click the same object again. 4. Repeat after successive impacts. Current behaviour The extra click can restart or shorten the next swing cycle, reducing the intended delay between impacts and allowing harvesting to complete faster than the automatic sequence. Historical requested correction, superseded One click starts the normal harvesting sequence. Extra clicks on the same active target do not shorten or reset the configured interval between impacts. Applies to both tree chopping and rock mining. Applies regardless of equipped harvesting tool. Required impact count, rewards and tool strength remain unchanged. Rapid clicking cannot create duplicate impacts or duplicate rewards."},{"id":"BUG-005","title":"Inaccessible Harvestable Tree near the Hero Tree","originalStory":"F03-US28","status":"Resolved","severity":"Human-confirmed report; severity/priority not assigned.","evidence":"Christiaan's 16 October 2026 playtest cleared nearly the entire starting island. He confirmed he could not approach and harvest the remaining ordinary tree immediately northeast of the permanent Hero Tree, partly overlapping its canopy, after clearing the other harvestable trees. He reports that the parchment map retains one ordinary tree symbol near the Hero Tree.","github":"","summary":"Identified from the supplied yellow-circled gameplay image and parchment map: Actors/Tree08, ordinary oak at (830,140), northeast of the protected Hero Tree at (625,405). Only this instance and its collision/hit-area subtree are removed after seeded scenery composition, before navigation/map initialization. No replacement or general mechanic changes. All 18,260 other captured scene nodes remain unchanged. 379 checks pass, including map, harvesting and collision/navigation tests. Christiaan human-accepted the removal of Tree08 on 16 October 2026. BUG-005 is Resolved; F03-US26 remains Complete."},{"id":"BUG-006","title":"Intermittent Footstep Playback Silence","originalStory":"F10-US02","status":"Open","severity":"Deferred; severity/priority not assigned.","evidence":"Reported on fresh launch or after focus return until another BTR SFX plays. A later Nature Dressing playtest did not reproduce it; that result is inconclusive.","github":"","summary":"Original story: F10-US02 Status: Open Severity/priority: Deferred; severity/priority not assigned. Reproduction/evidence: Reported on fresh launch or after focus return until another BTR SFX plays. A later Nature Dressing playtest did not reproduce it; that result is inconclusive. Known issue: footsteps may remain silent at startup or after focus return until another BTR SFX plays. Preloading, persistent footstep playback and an inaudible keepalive did not solve it. Keep open but deferred until new evidence or audio work is prioritized. A later Nature Dressing playtest did not reproduce the issue, but that observation does not close this story."}];
const STATUS=['Backlog','Ready for development','Developing','Playtesting','Complete'];
const BUG_STATUS=['Open','Needs Reproduction','Resolved',"Won't Fix"];
const CLASS={'Backlog':'Backlog','Ready for development':'Ready','Developing':'Developing','Playtesting':'Playtesting','Complete':'Complete','Retired':'Retired','Open':'BugOpen','Needs Reproduction':'BugRepro','Resolved':'BugResolved',"Won't Fix":'BugWontFix'};
const LABEL={'Backlog':'Backlog','Ready for development':'Ready','Developing':'Developing','Playtesting':'Playtesting','Complete':'Complete','Retired':'Retired'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='All',query='',expanded=new Set();
const grid=document.getElementById('grid'),filters=document.getElementById('filters'),stats=document.getElementById('stats'),tip=document.getElementById('tooltip'),search=document.getElementById('search'),expandAll=document.getElementById('expandAll'),legend=document.getElementById('legend'),bugsSection=document.getElementById('bugsSection'),bugGrid=document.getElementById('bugGrid');
const activeStories=f=>f.stories.filter(s=>s.status!=='Retired');
function featureMatches(f){
  if(selected==='Bugs'||selected.startsWith('Bug:'))return {show:false,stories:[]};
  const q=query.trim().toLowerCase();
  const titleHit=!q||(f.id+' '+f.title+' '+f.description).toLowerCase().includes(q);
  const eligible=f.stories.filter(s=>selected==='Retired'?s.status==='Retired':(selected==='All'&&q)||s.status!=='Retired');
  const statusActive=STATUS.includes(selected);
  const matches=eligible.filter(s=>(!statusActive||s.status===selected)&&(!q||titleHit||(s.id+' '+s.title+' '+s.summary).toLowerCase().includes(q)));
  return {show:matches.length>0||(!statusActive&&selected!=='Retired'&&!f.stories.length&&titleHit),stories:matches};
}
function visibleBugs(){
  if(selected!=='All'&&selected!=='Bugs'&&!selected.startsWith('Bug:'))return [];
  const q=query.trim().toLowerCase();
  return BUGS.filter(b=>(!selected.startsWith('Bug:')||b.status===selected.slice(4))&&(!q||(b.id+' '+b.title+' '+b.originalStory+' '+b.status+' '+b.severity+' '+b.evidence+' '+b.summary+' '+b.github).toLowerCase().includes(q)));
}
function progressHtml(f){
  const active=activeStories(f);
  if(!active.length)return '<div class="progress empty" aria-label="No active feature stories"></div>';
  const counts=Object.fromEntries(STATUS.map(s=>[s,0]));active.forEach(s=>counts[s.status]++);
  return '<div class="progress" aria-label="'+esc(STATUS.filter(s=>counts[s]).map(s=>counts[s]+' '+s).join(', '))+'">'+STATUS.filter(s=>counts[s]).map(s=>'<span class="seg '+CLASS[s]+'" style="width:'+(counts[s]/active.length*100)+'%"></span>').join('')+'</div>';
}
function dotsHtml(f,stories=activeStories(f)){
  if(!stories.length)return '<div class="no-stories">No stories in this view</div>';
  return '<div class="dots" aria-label="'+stories.length+' story status markers">'+stories.map(s=>'<span class="dot '+CLASS[s.status]+'" data-tip-title="'+esc(s.id+'. '+s.title)+'" data-tip-status="'+esc(s.status)+'" data-tip-intent="'+esc(s.summary)+'" title="'+esc(s.id+'. '+s.title+' · '+s.status)+'"></span>').join('')+'</div>';
}
function visibleFeatures(){return FEATURES.map(f=>({f,m:featureMatches(f)})).filter(x=>x.m.show)}
function forcedOpen(){return selected!=='All'||query.trim().length>0}
function toggleCard(id){if(forcedOpen())return;expanded.has(id)?expanded.delete(id):expanded.add(id);render()}
function render(){
  const vis=visibleFeatures(),bugs=visibleBugs();grid.innerHTML='';bugGrid.innerHTML='';
  const all=FEATURES.flatMap(f=>f.stories),active=all.filter(s=>s.status!=='Retired');
  const counts=Object.fromEntries(STATUS.map(s=>[s,0]));active.forEach(s=>counts[s.status]++);
  document.getElementById('backlogMeta').textContent='v0.5.0 · 11 November 2026 · '+FEATURES.length+' features · '+active.length+' active feature stories · '+(all.length-active.length)+' retired · '+BUGS.length+' bugs';
  let shownStories=0;
  vis.forEach(({f,m})=>{
    shownStories+=m.stories.length;
    const open=forcedOpen()||expanded.has(f.id),retired=f.stories.length-activeStories(f).length;
    const sec=document.createElement('section');sec.className='feature'+(open?' open':'');sec.dataset.id=f.id;
    sec.innerHTML='<button class="feature-head" type="button" aria-expanded="'+open+'"><div class="feature-top"><span class="chevron">›</span><span class="fid">'+esc(f.id)+'</span><span class="feature-title">'+esc(f.title)+'</span><span class="feature-count">'+m.stories.length+' shown · '+activeStories(f).length+' active'+(retired?' · '+retired+' retired':'')+'</span></div>'+progressHtml(f)+dotsHtml(f,m.stories)+'</button><div class="feature-body" '+(open?'':'hidden')+'><div class="feature-desc">'+esc(f.description)+'</div><ul class="stories"></ul></div>';
    const ul=sec.querySelector('.stories');
    m.stories.forEach(s=>{const li=document.createElement('li');li.className='story';li.dataset.tipTitle=s.id+'. '+s.title;li.dataset.tipStatus=s.status;li.dataset.tipIntent=s.summary;li.innerHTML='<div class="story-name"><span class="sid">'+esc(s.id)+'</span>'+esc(s.title)+'</div><span class="badge '+CLASS[s.status]+'">'+esc(s.status)+'</span>';ul.appendChild(li)});
    sec.querySelector('.feature-head').addEventListener('click',()=>toggleCard(f.id));grid.appendChild(sec);
  });
  bugsSection.hidden=bugs.length===0;
  bugs.forEach(b=>{
    const open=forcedOpen()||expanded.has(b.id),sec=document.createElement('section');sec.className='feature bug-card'+(open?' open':'');sec.dataset.id=b.id;
    sec.innerHTML='<button class="feature-head" type="button" aria-expanded="'+open+'"><div class="feature-top"><span class="chevron">›</span><span class="fid">'+esc(b.id)+'</span><span class="feature-title">'+esc(b.title)+'</span><span class="badge '+CLASS[b.status]+'">Bug: '+esc(b.status)+'</span></div></button><div class="feature-body" '+(open?'':'hidden')+'><div class="bug-detail"><b>Original story:</b> '+esc(b.originalStory)+'<br><b>Severity / priority:</b> '+esc(b.severity)+'</div><div class="bug-detail">'+esc(b.evidence)+'</div><ul class="stories"></ul>'+(b.github?'<div class="bug-detail"><a href="'+esc(b.github)+'" target="_blank" rel="noopener noreferrer">Existing GitHub issue</a></div>':'')+'</div>';
    const row=document.createElement('li');row.className='story';row.dataset.tipTitle=b.id+'. '+b.title+' (formerly '+b.originalStory+')';row.dataset.tipStatus='Bug: '+b.status;row.dataset.tipIntent=b.summary;row.innerHTML='<div class="story-name">Details / historical scope</div><span class="sid">'+esc(b.originalStory)+'</span>';sec.querySelector('.stories').appendChild(row);
    sec.querySelector('.feature-head').addEventListener('click',()=>toggleCard(b.id));bugGrid.appendChild(sec);
  });
  if(!vis.length&&!bugs.length)grid.innerHTML='<div class="empty-state">No features, retired stories or bugs match the current search/filter.</div>';
  stats.innerHTML='<span class="stat"><b>'+FEATURES.length+'</b> features</span><span class="stat"><b>'+active.length+'</b> active feature stories</span>'+STATUS.slice().reverse().map(s=>'<span class="stat">'+esc(LABEL[s])+' <b>'+counts[s]+'</b></span>').join('')+'<span class="stat">Retired <b>'+(all.length-active.length)+'</b></span><span class="stat">Bugs <b>'+BUGS.length+'</b></span>';
  // Use the exact matched records that render into cards, including search and bug-only filters.
  const shown=vis.flatMap(({m})=>m.stories);
  const storyCounts=Object.fromEntries([...STATUS,'Retired'].map(s=>[s,0]));
  shown.forEach(s=>storyCounts[s.status]++);
  const bugCounts=Object.fromEntries(BUG_STATUS.map(s=>[s,0]));
  bugs.forEach(b=>bugCounts[b.status]++);
  const groups=[...STATUS,'Retired'].filter(s=>storyCounts[s]).map(s=>({label:LABEL[s],count:storyCounts[s],css:CLASS[s],color:overviewColor(s)}));
  const bugGroups=BUG_STATUS.filter(s=>bugCounts[s]).map(s=>({label:'Bug: '+s,count:bugCounts[s],css:CLASS[s],color:overviewColor(s)}));
  const parts=groups.length?groups:bugGroups;
  const total=parts.reduce((n,p)=>n+p.count,0);
  const bar=total?parts.map(p=>'<span class="seg '+p.css+'" style="width:'+(p.count/total*100)+'%" title="'+esc(p.label+': '+p.count)+'"></span>').join(''):'';
  const breakdown=[...groups,...bugGroups].map(p=>'<span class="overall-item"><span class="legend-dot" style="background:var('+p.color+')"></span>'+esc(p.label)+' <b>'+p.count+'</b></span>').join('');
  const scope=selected==='All'?'All active stories + bugs':selected==='Active'?'Active stories':selected==='Retired'?'Retired stories':selected==='Bugs'?'All bugs':selected.startsWith('Bug:')?'Bug status: '+selected.slice(4):'Story status: '+selected;
  document.getElementById('overall').innerHTML='<div class="overall-head"><div><div class="overall-title">Overall project status</div><div class="overall-scope">'+esc(scope)+(query.trim()?' · Search: '+esc(query.trim()):'')+'</div></div><div class="overall-totals">'+shown.length+' '+(shown.length===1?'story':'stories')+' shown · '+bugs.length+' '+(bugs.length===1?'bug':'bugs')+'</div></div><div class="overall-bar" role="img" aria-label="'+esc(parts.map(p=>p.count+' '+p.label).join(', ')||'No matching records')+'">'+bar+'</div><div class="overall-breakdown">'+(breakdown||'<span class="overall-item">No matching items</span>')+'</div>';
  const keys=[...vis.map(({f})=>f.id),...bugs.map(b=>b.id)];
  const allExpanded=keys.length>0&&!forcedOpen()&&keys.every(id=>expanded.has(id));
  expandAll.textContent=allExpanded?'Collapse all':'Expand all';expandAll.disabled=forcedOpen()||keys.length===0;expandAll.title=forcedOpen()?'Matching records expand automatically while search/filter is active':'';
}
const filterButton=(value,label)=>'<button class="filter'+(value==='All'?' active':'')+'" data-s="'+esc(value)+'" type="button">'+esc(label)+'</button>';
filters.innerHTML=filterButton('All','All active stories + bugs')+filterButton('Active','Active stories')+'<span class="filter-label">Stories:</span>'+STATUS.map(s=>filterButton(s,LABEL[s])).join('')+filterButton('Retired','Retired')+'<span class="filter-label">Bugs:</span>'+filterButton('Bugs','All bugs')+BUG_STATUS.map(s=>filterButton('Bug:'+s,s)).join('');
filters.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;selected=b.dataset.s;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});
search.addEventListener('input',()=>{query=search.value;render()});
expandAll.addEventListener('click',()=>{const keys=[...visibleFeatures().map(({f})=>f.id),...visibleBugs().map(b=>b.id)];const all=keys.length&&keys.every(id=>expanded.has(id));keys.forEach(id=>all?expanded.delete(id):expanded.add(id));render()});
const overviewColor=s=>({Backlog:'--backlog','Ready for development':'--ready',Developing:'--developing',Playtesting:'--playtesting',Complete:'--complete',Retired:'--retired',Open:'--bugopen','Needs Reproduction':'--bugrepro',Resolved:'--bugresolved',"Won't Fix":'--bugwontfix'})[s];
const colors={'Backlog':'backlog','Ready for development':'ready','Developing':'developing','Playtesting':'playtesting','Complete':'complete','Retired':'retired','Open':'bugopen','Needs Reproduction':'bugrepro','Resolved':'bugresolved',"Won't Fix":'bugwontfix'};
legend.innerHTML=[...STATUS,'Retired',...BUG_STATUS].map(s=>'<span class="legend-item"><span class="legend-dot" style="background:var(--'+colors[s]+')"></span>'+esc(BUG_STATUS.includes(s)?'Bug: '+s:LABEL[s])+'</span>').join('');
function showTip(node){const title=node.dataset.tipTitle||node.dataset.title;if(!title)return;const status=node.dataset.tipStatus||node.dataset.status||'',intent=node.dataset.tipIntent||node.dataset.intent||'';tip.innerHTML='<b>'+esc(title)+'</b><span>'+esc(status)+'</span>'+(intent?'<small>Current intent / result</small><div>'+esc(intent)+'</div>':'');tip.classList.add('show')}
document.addEventListener('mouseover',e=>{const n=e.target.closest('.story,.dot');if(n)showTip(n)});
document.addEventListener('mousemove',e=>{if(!tip.classList.contains('show'))return;let x=e.clientX+14,y=e.clientY+14;if(x+tip.offsetWidth>innerWidth-10)x=e.clientX-tip.offsetWidth-14;if(y+tip.offsetHeight>innerHeight-10)y=e.clientY-tip.offsetHeight-14;tip.style.left=Math.max(10,x)+'px';tip.style.top=Math.max(10,y)+'px'});
document.addEventListener('mouseout',e=>{const n=e.target.closest('.story,.dot');if(n&&!n.contains(e.relatedTarget))tip.classList.remove('show')});
render();
</script>
