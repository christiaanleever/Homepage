<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Beyond the River | Feature Backlog Overview</title>
<style>
:root{--bg:#0e1515;--panel:#172321;--panel2:#1b2926;--border:#30413d;--text:#eef3ed;--muted:#9eaaa4;--accent:#d6b36a;--backlog:#7f8a86;--ready:#5b9fe3;--developing:#d75d5d;--playtesting:#e59b4b;--complete:#56b878;--empty:#43524e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 0%,#1d3029 0,#0e1515 40%);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif;font-size:13px;line-height:1.4}
button,input{font:inherit}
.shell{max-width:1500px;margin:auto;padding:22px 22px 44px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:24px}.subtitle{color:var(--muted);font-size:11px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{min-width:260px;flex:1 1 280px;max-width:480px;background:#13201e;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;outline:none}
.search:focus{border-color:#6e817a;box-shadow:0 0 0 2px rgba(110,129,122,.18)}
.filters,.stats{display:flex;gap:6px;flex-wrap:wrap}.filters{margin-bottom:10px}.stats{margin-bottom:14px}
.filter,.stat,.badge,.expand-all{border-radius:999px;border:1px solid var(--border);background:#13201e;color:var(--muted)}
.filter,.expand-all{padding:5px 9px;cursor:pointer}.filter.active,.expand-all:hover{color:#fff;border-color:#6e817a;background:#263633}
.stat{padding:5px 8px}.stat b{color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.feature{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.feature-head{width:100%;display:block;text-align:left;background:transparent;color:inherit;border:0;padding:10px 11px;cursor:pointer}
.feature-head:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.feature-top{display:flex;gap:8px;align-items:center;min-width:0}
.fid{color:var(--accent);font-weight:800;flex:none}.feature-title{font-weight:750;min-width:0}.feature-count{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}
.chevron{width:13px;display:inline-block;text-align:center;color:var(--muted);transition:transform .15s ease;flex:none}.feature.open .chevron{transform:rotate(90deg)}
.progress{height:6px;background:var(--empty);border-radius:999px;overflow:hidden;display:flex;margin-top:8px}.progress.empty{background:#273431;border:1px solid #3b4a46}
.seg{height:100%}.seg.Backlog{background:var(--backlog)}.seg.Ready{background:var(--ready)}.seg.Developing{background:var(--developing)}.seg.Playtesting{background:var(--playtesting)}.seg.Complete{background:var(--complete)}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px;min-height:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--empty);cursor:help}.dot.Backlog{background:var(--backlog)}.dot.Ready{background:var(--ready)}.dot.Developing{background:var(--developing)}.dot.Playtesting{background:var(--playtesting)}.dot.Complete{background:var(--complete)}
.no-stories{color:var(--muted);font-size:10px;margin-top:6px}
.feature-body{border-top:1px solid var(--border);padding:8px 6px 6px}.feature-desc{color:#c4d0ca;font-size:11px;padding:2px 6px 7px}
.stories{list-style:none;padding:0;margin:0}.story{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;padding:6px;border-radius:7px;cursor:help}.story:hover{background:#22322f}
.sid{color:#879892;font-size:9.5px;font-weight:700;margin-right:5px}.story-name{font-size:11.5px}
.badge{padding:2px 6px;font-size:9.5px;font-weight:700}.badge.Backlog{color:#c8cfcc;border-color:#59635f;background:#2b3330}.badge.Ready{color:#a9d4ff;border-color:#3b6387;background:#1d3042}.badge.Developing{color:#ffaaaa;border-color:#753d3d;background:#392525}.badge.Playtesting{color:#ffd29a;border-color:#8b5a24;background:#402d19}.badge.Complete{color:#9cddb1;border-color:#3d7652;background:#1e3928}
.legend{display:flex;gap:9px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:10px;margin:-5px 0 12px}.legend-item{display:flex;align-items:center;gap:4px}.legend-dot{width:7px;height:7px;border-radius:50%}
.tooltip{position:fixed;display:none;z-index:99;width:min(520px,calc(100vw - 24px));background:#f5f0df;color:#26302c;border:1px solid #cbbf9e;border-radius:9px;padding:10px 12px;box-shadow:0 15px 45px rgba(0,0,0,.42);pointer-events:none}.tooltip.show{display:block}.tooltip b{display:block;margin-bottom:5px}.tooltip small{display:block;margin-top:6px;color:#796f58;text-transform:uppercase;font-weight:800;letter-spacing:.6px}
.empty-state{grid-column:1/-1;color:var(--muted);padding:18px;border:1px dashed var(--border);border-radius:10px;text-align:center}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.shell{padding:14px 10px 32px}.grid{grid-template-columns:1fr}.search{min-width:100%;max-width:none}}
@media(prefers-reduced-motion:reduce){.chevron{transition:none}}
</style>
</head>

<header><div><h1>Beyond the River · Feature Backlog</h1><div class="subtitle">v0.3.10 · 25 September 2026 · 17 defined features · 116 user stories</div></div></header>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="Search features or stories…" aria-label="Search features or stories"><button id="expandAll" class="expand-all" type="button">Expand all</button></div>

<script>
const FEATURES=[{"id":"F01","title":"Gameplay Feel & Responsiveness","description":"Make direct control feel immediate, predictable and pleasant while keeping collision and traversal readable.","stories":[{"id":"F01-US01","title":"Immediate WASD Movement","status":"Complete","summary":"Immediate start/stop/direction changes are accepted."},{"id":"F01-US02","title":"Tune Base Movement Speed","status":"Complete","summary":"200 px/s remains the accepted normal-game baseline. Temporary playtest infrastructure now selects 1.0x, 2.0x or 4.0x for 200, 400 or 800 px/s, defaulting to 400 px/s."},{"id":"F01-US03","title":"Consistent Right-Click Movement","status":"Complete","summary":"Right-click movement matches direct movement appropriately; WASD cancels it immediately; marker-free presentation is accepted."},{"id":"F01-US04","title":"Responsive Camera Follow","status":"Complete","summary":"Tight, unsmoothed camera response is accepted for the POC."},{"id":"F01-US05","title":"Solid Collision Feel","status":"Complete","summary":"Trees, rocks and current structures block where expected with appropriately compact grounded footprints."},{"id":"F01-US06","title":"Clear Walkable vs Non-Walkable Areas","status":"Complete","summary":"Basic walkability and solid-object readability are accepted. Shallow-water immersion is tracked separately."},{"id":"F01-US07","title":"Stable Frame Rate Baseline","status":"Complete","summary":"The earlier representative visual slice felt smooth in normal play. The later full-map ecology pass has variable synthetic frame samples, so release/performance validation remains a future concern rather than reopening this basic POC story."},{"id":"F01-US08","title":"Input Responsiveness Test Pass","status":"Complete","summary":"Start/stop/reverse/diagonal/obstacle/click-interruption behaviour is accepted."},{"id":"F01-US09","title":"Terrain-Based Movement Speed","status":"Complete","summary":"The 0.70 shallow-water multiplier is accepted and applies to the currently selected playtest speed: 140, 280 or 560 px/s shallow versus 200, 400 or 800 px/s dry. Other terrain categories remain future work."},{"id":"F01-US10","title":"Temporary Fast POC Testing Speed","status":"Complete","summary":"The temporary screen-anchored developer selector offers Half, Normal and Double relative to the familiar 400 px/s POC speed: 200, 400 and 800 px/s, with 400 px/s selected at launch. It exists only for traversal and collision playtesting and must not be mistak…"},{"id":"F01-US11","title":"Allow Right-Click Attempts Into Dangerous Water","status":"Complete","summary":"Quick and held right-click attempts may enter deep water rather than being rejected at input time. A temporary devallowdeepwaterexploration override currently suppresses drowning for world inspection while retaining the underlying drowning flow. WASD may also…"},{"id":"F01-US12","title":"Assisted WASD Obstacle Navigation","status":"Complete","summary":"Direct WASD adds a small local tangent deflection when an obstacle blocks the requested direction, choosing the nearby side with brief persistence. It remains immediate direct control, not pathfinding, and is human-accepted at 200, 400 and 800 px/s for the PO…"},{"id":"F01-US13","title":"Right-Click Approach to Blocked Destinations","status":"Complete","summary":"Blocked objects are approached to a sensible reachable point without auto-interaction."},{"id":"F01-US14","title":"Fallen Log Collision Fit","status":"Complete","summary":"The accepted correction keeps an elongated diagonal trunk footprint, shifts it 10 px downward and excludes surrounding foliage. Physics and human traversal checks confirm the visible trunk blocks without a foliage-sized obstacle."},{"id":"F01-US15","title":"Dense-Environment WASD Traversal Friction Review","status":"Complete","summary":"- Do not judge this primarily at the temporary 400 px/s test speed and wide developer zoom. - Re-evaluate at the intended 200 px/s normal movement and likely closer release camera before changing tree density/collision. - Preserve environmental richness unles…"},{"id":"F01-US16","title":"Continuous Right-Button Hold-to-Move","status":"Complete","summary":"The selector, quick click, 0.18-second hold transition, continuous steering and WASD cancellation are human-approved. Speed-aware path-point acceptance at 800 px/s and unchanged-target handling prevent route restarts. Deep-water traversal may still jitter whi…"}]},{"id":"F02","title":"Visual Art Direction & World Readability","description":"Move the game toward the warm, organic Concept A / North Star visual family with a reusable mid-resolution pixel-art production language.","stories":[{"id":"F02-US01","title":"Establish Concept A Visual Baseline","status":"Developing","summary":"The full-map ecology/dressing pass is now accepted for the POC. Remaining baseline work includes shoreline/water refinement, shallow-water physicality, environmental motion and remaining placeholder state/landmark art."},{"id":"F02-US02","title":"Improve Grass and Ground","status":"Complete","summary":"The accepted grass/ground language and Nature Dressing overlays now cover the starting island and visible opposite banks. A single under-dressed central field is accepted as minor POC polish and tracked under F02-US18 rather than keeping this broad story open."},{"id":"F02-US03","title":"Create Organic Shorelines","status":"Ready for development","summary":"Widen/soften beach transitions and blend shallow/deep water without a hard danger line. Ground overlays must stay visually on land; shoreline vegetation may overlap shallow water naturally. After higher-priority placeholder art is solved, a very small reusabl…"},{"id":"F02-US04","title":"Tree Visual Variety","status":"Complete","summary":"Four accepted normal production tree variants are clearly distinct at gameplay distance."},{"id":"F02-US05","title":"Rock Visual Variety","status":"Complete","summary":"Three accepted production rock variants are clearly distinct. Depleted states remain separate work."},{"id":"F02-US06","title":"Establish the Intended Starting-Island Visual","status":"Ready for development","summary":"The natural/ecological composition is now accepted for the POC, but the intended final starting-island content rules still exclude legacy starting structures/ruin placeholders. Do not spend current quota polishing the accepted ecology merely to close this bro…"},{"id":"F02-US07","title":"Object Grounding and Contact Shadows","status":"Complete","summary":""},{"id":"F02-US08","title":"Correct Top-Down Depth Sorting","status":"Complete","summary":""},{"id":"F02-US09","title":"Tree Canopy Occlusion","status":"Complete","summary":"Hover brightening and occlusion alpha combine without blinking. Accepted fading samples actual tree sprite alpha at the Wanderer's feet above a tree-class height threshold, so shallow roots and base decoration stay opaque while genuine trunk or canopy coverag…"},{"id":"F02-US10","title":"Character Visual Direction","status":"Complete","summary":"The first Wanderer set remains accepted: 28 x 42 canvas, four directions, one idle and four walk frames per direction, 9 fps."},{"id":"F02-US11","title":"Subtle Environmental Motion","status":"Ready for development","summary":"Water movement exists but should become perceptible within a few seconds of normal observation while remaining calm. Cheap canopy/reed motion remains optional."},{"id":"F02-US12","title":"Lightweight Character Appearance Customization","status":"Backlog","summary":""},{"id":"F02-US13","title":"Player Camera Zoom Levels","status":"Complete","summary":"The current POC supports 1.0x, 1.5x, 2.0x, 2.5x and 3.0x, with 2.0x as the current development/reference default. Do not change the POC camera now. Release-facing framing policy is tracked separately in F02-US17."},{"id":"F02-US14","title":"Natural Vegetation Distribution","status":"Complete","summary":"The full-map ecological placement pass is accepted for the POC."},{"id":"F02-US15","title":"Clean Gameplay View","status":"Complete","summary":""},{"id":"F02-US16","title":"Nature Dressing Pack A","status":"Complete","summary":"The production dressing vocabulary has been created, integrated and rolled out across the starting island and visible opposite banks, and the overall result is human-approved for the POC."},{"id":"F02-US17","title":"Release Camera Framing & Zoom Limits","status":"Backlog","summary":"- Do not change the current POC zoom implementation now. - Near release / broader gameplay-balancing, test a closer default camera, likely around the current 3.0x or 2.5x range. - Consider limiting free-roaming zoom-out to approximately the current middle lev…"},{"id":"F02-US18","title":"Final Ecology & Field Polish","status":"Complete","summary":"Large smooth lawn-like openings are no longer accepted. The approved direction is dense natural meadow across almost all traversable open land, using meadow ground, broad grass clusters, individual tufts and weeds with small irregular gaps. The current correc…"},{"id":"F02-US19","title":"Large Grass / Meadow Overlay Family","status":"Complete","summary":"- create a small reusable family of approximately 3-4 large transparent grass/meadow overlays - target roughly 100-250 px footprints where that reads naturally relative to the 42 px Wanderer; exact dimensions remain art-led - match the accepted base-grass ter…"},{"id":"F02-US20","title":"Hero / Landmark Tree","status":"Complete","summary":"- start with one exceptional ancient broad-canopy tree rather than a hero-tree library - substantially larger and more characterful than ordinary resource trees, with a strong silhouette and old/twisted trunk/root character - same palette, perspective and nat…"},{"id":"F02-US21","title":"Contextual Depth Sorting for Enterable Ruins","status":"Backlog","summary":"- large structures may need separate visual/depth sections rather than one fixed layer - behind the opposite-bank ruin, the Wanderer should render behind the appropriate walls and structure - on the front stairs, the Wanderer should remain visible in front of…"}]},{"id":"F03","title":"Interaction, Tools & Environmental Feedback","description":"Make interactions physical, readable and satisfying.","stories":[{"id":"F03-US01","title":"Clear Interaction Targeting","status":"Ready for development","summary":"Keep accepted hover feedback and later replace generic hand cursor feedback with contextual axe/pickaxe/neutral interaction cursors."},{"id":"F03-US02","title":"Tool-in-Hand Feedback","status":"Complete","summary":"Show the appropriate equipped tool during physical harvesting: axes for trees and pickaxes for rocks. Tool heads should make material tiers readable: wooden tools use brown heads, stone tools dark gray, iron tools light silver-gray, and later tiers follow the…"},{"id":"F03-US03","title":"Tree Harvest Animation","status":"Complete","summary":"One click starts repeated axe swings, tree reaction/leaves, a short fall and stump/drop state. First-pass chopping audio is tracked separately under F03-US20 and accepted for the current POC. Only an axe can harvest a tree. A normal tree takes 6 hits with a W…"},{"id":"F03-US04","title":"Rock Mining Animation","status":"Complete","summary":"One click starts repeated pickaxe strikes, rock tremble/debris, a short crumble and depleted state. First-pass mining audio is tracked separately under F03-US20 and accepted for the current POC. Only a pickaxe can mine a rock. A normal starting rock takes 6 h…"},{"id":"F03-US05","title":"Satisfying Item Drops","status":"Complete","summary":""},{"id":"F03-US06","title":"Satisfying Item Pickup","status":"Complete","summary":"Automatic short-range magnetic pull is accepted; repetitive +1 resource text is suppressed. The current attraction radius is 68.75 world pixels after the accepted 25% increase from 55; the short pull, pickup grace and reward quantities remain unchanged."},{"id":"F03-US07","title":"Chest Opening Feedback","status":"Complete","summary":""},{"id":"F03-US08","title":"Invalid Tool Feedback","status":"Complete","summary":"Existing invalid-tool feedback is implemented. For the approved harvesting progression, wrong or missing tools must prevent resource extraction and show the appropriate exact message:"},{"id":"F03-US09","title":"Shallow Water Feedback","status":"Ready for development","summary":"The old circular ring is removed and accepted. Remaining work is lower-foot submersion/overlap and local ripples/splashes."},{"id":"F03-US10","title":"Drowning Feedback","status":"Complete","summary":""},{"id":"F03-US11","title":"Temporary Control Hint Instead of Permanent Overlay","status":"Complete","summary":"Approximately 10 seconds, fades, does not return after respawn."},{"id":"F03-US12","title":"Reactive Vegetation","status":"Backlog","summary":""},{"id":"F03-US13","title":"Species-Appropriate Harvested Tree States","status":"Complete","summary":"Create production stump states that visibly belong to the four normal tree families: broad oak-like, birch, tall/spiky poplar-like, and drooping broadleaf/willow-like. Preserve recognizable bark palette, trunk width and root/base character rather than merely…"},{"id":"F03-US14","title":"Variant-Appropriate Depleted Rock States","status":"Complete","summary":"Create one clearly depleted/broken production state for each of the three accepted mineable rock variants. Each state should retain a relationship to its source rock while changing silhouette enough to read immediately as mined; tiny crack-only edits are not…"},{"id":"F03-US15","title":"Individual Diegetic Resource Drops","status":"Complete","summary":"Four randomized quantity-one Wood pieces and three randomized quantity-one Stone pieces, 0.25-second pre-attraction grace, independent magnetic pickup and no x4/x3 labels are accepted for current normal resources. A normal tree remains worth 4 Wood. Medium tr…"},{"id":"F03-US16","title":"Production Wood & Stone Pickup Art","status":"Complete","summary":"- create one production sprite for one Wood unit; four copies must read naturally as four harvested wood pieces - create one production sprite for one Stone unit; three copies must read naturally as three loose stones - keep both substantially smaller than th…"},{"id":"F03-US17","title":"Production Chest Art Family","status":"Complete","summary":"- create at least closed and open/empty states - readable beside the 42 px Wanderer at normal gameplay distance - warm weathered wood/metal construction, adventurous but not cartoonishly exaggerated - transparent background and production-consistent pixel den…"},{"id":"F03-US18","title":"Tree Size-Tier Harvesting & Protected Landmark Tree","status":"Complete","summary":"Normal tree = ordinary resource. Medium tree = valuable removable resource and landscape-shaping choice. Hero tree = permanent landmark."},{"id":"F03-US19","title":"Resource Hardness and Tool Harvesting Strength","status":"Complete","summary":"- represent resource hardness and tool harvesting strength in data rather than hard-coding each resource/tool pair - enforce tool categories: axes harvest trees only, pickaxes mine rocks only, and a wrong or missing tool cannot harvest - support the approved…"},{"id":"F03-US20","title":"Harvest Interaction Sounds","status":"Complete","summary":"- use distinct wood and stone cues triggered on the actual valid harvest hit - keep volume restrained and repeated hits free of unpleasant overlap - use original/project-owned or otherwise clearly commercial-safe assets with recorded provenance - allow later…"},{"id":"F03-US21","title":"Keep the Clicked Tree as the Harvest Target","status":"Backlog","summary":"Known non-blocking bug: When approaching a clicked distant tree, the Wanderer can harvest an intervening tree first, particularly while travelling south to north. Keep interaction associated with the selected tree; passing another harvestable must not silentl…"},{"id":"F03-US22","title":"Allow Cross-River Movement and Interaction Attempts","status":"Backlog","summary":"Known non-blocking bug: A left-click on an out-of-range opposite-bank harvestable can immediately say \"I can't reach that from here,\" and destination validation can reject a cross-river movement attempt. Right-click destinations and left-click targets across…"},{"id":"F03-US23","title":"Keep Harvest Drops on the Harvested Object's Bank","status":"Backlog","summary":"Known non-blocking bug: Under current testing conditions, harvesting an opposite-bank tree can place Wood drops in starting-island shallow water. Resolve drops from the harvested object's actual world position so far-bank resources appear on or near the far b…"}]},{"id":"F04","title":"Progression, Inventory & Crafting","description":"Simple progression where resources/tools expand capability without inventory becoming a chore.","stories":[{"id":"F04-US01","title":"Reliable Basic Inventory","status":"Complete","summary":""},{"id":"F04-US02","title":"Simple Crafting Interface","status":"Complete","summary":"The interface crafts every early tool, including the Wooden Axe found first in the starting chest. Current recipes:"},{"id":"F04-US03","title":"Tool Requirement for Stone","status":"Complete","summary":"Current POC mining requires a pickaxe, and trees require an axe. Category enforcement belongs to F03-US08 and F03-US19."},{"id":"F04-US04","title":"Starting Chest Introduces the Wooden Axe","status":"Complete","summary":"The existing starting-island chest is near spawn, visible within the initial camera view but not directly beside the Wanderer. No other island chest was added. Its one-time reward is 1 Wooden Axe with the exact message: \"You found a Wooden Axe in the chest.\"…"},{"id":"F04-US05","title":"Data-Driven Item Definitions","status":"Backlog","summary":""},{"id":"F04-US06","title":"Upgrade Old Gear Instead of Replacing It","status":"Backlog","summary":"The early Stone Axe and Stone Pickaxe recipes consume their corresponding wooden tools. Later tiers may use Iron, Steel and stronger materials. Durability, breakage, item dropping and tool loss remain future possibilities, not current implementation scope."},{"id":"F04-US07","title":"Avoid Late-Game Inventory Clutter","status":"Backlog","summary":""},{"id":"F04-US08","title":"Multiple Paths to Expensive Progression","status":"Backlog","summary":""},{"id":"F04-US09","title":"Craft Stone Pickaxe","status":"Complete","summary":""},{"id":"F04-US10","title":"Discover Significant Crafting Recipes","status":"Backlog","summary":"For the future demo, important progression recipes need not appear automatically in a complete visible list. Let players sometimes discover how to make something through clues, notes, drawings, chests, environmental knowledge, experimentation, prerequisite ma…"}]},{"id":"F05","title":"Exploration, World Structure & Discovery","description":"Use curiosity, visible unreachable places and natural capability gates to pull the player through the world.","stories":[{"id":"F05-US01","title":"Island Surrounded by River","status":"Complete","summary":""},{"id":"F05-US02","title":"Visible Opposite Riverbanks","status":"Complete","summary":"The far banks now also receive full ecological/resource dressing so they read as real continuation terrain rather than sparse scenery."},{"id":"F05-US03","title":"Opposite-Bank Stone Ruin","status":"Complete","summary":"The placeholder was replaced by a production ancient stone ruin downscaled directly from the large master to the accepted 200 x 200 game asset. Its shoreline placement and scale are human-approved. Fitted solid masonry collision preserves the open stair corri…"},{"id":"F05-US04","title":"Opposite-Bank Closed Chest","status":"Complete","summary":"The accepted distant placement uses the same production closed/open chest art and one-time interaction behavior as the starting-island chest. Its reward remains 1 Stone Pickaxe after the island chest changes to a Wooden Axe. It cannot be opened remotely and r…"},{"id":"F05-US05","title":"X Marks the Spot","status":"Complete","summary":"The wooden-looking placeholder was replaced by the accepted production sand patch with the X dug into the ground. Its scale and shoreline placement are human-approved, and it remains walkable as intended."},{"id":"F05-US06","title":"Natural Boundaries Instead of Invisible Walls","status":"Complete","summary":""},{"id":"F05-US07","title":"Exploration Rewards Support Progression","status":"Complete","summary":"The former island-chest Stone Pickaxe shortcut is superseded by F04-US04. The visible near-spawn chest rewards discovery with the first Wooden Axe and introduces the intended harvesting path. The same axe is also craftable. Future exploration rewards may stil…"},{"id":"F05-US08","title":"Hidden Discoveries","status":"Backlog","summary":""},{"id":"F05-US09","title":"Discovery Guidance Without Mandatory Quests","status":"Backlog","summary":""},{"id":"F05-US10","title":"World Expansion Changes the Player's Mental Map","status":"Backlog","summary":"Core progression philosophy remains See - Want - Prepare - Cross - Discover - Master - See Further."},{"id":"F05-US11","title":"Elevated Lookout / Observation Mode","status":"Backlog","summary":"- a craftable simple wooden lookout tower is one possible first example - natural cliffs, towers, treehouses or other viewpoints may later use the same idea - while at the lookout, temporarily allow a far zoom comparable to current 1.5x/1.0x developer overvie…"},{"id":"F05-US12","title":"Progressive Travel Mobility","status":"Backlog","summary":"- preserve meaningful early on-foot distance rather than solving world scale with permanently high base speed - later progression may provide roads, boats, mounts, shortcuts, transport systems or carefully designed fast travel - unlocks should make previously…"},{"id":"F05-US13","title":"Hidden Boat-Enabled Demo Crossing","status":"Backlog","summary":"Approved future Steam-demo direction, not current POC behaviour: The central question is \"Can I get Beyond the River?\" A non-obvious but discoverable progression/crafting chain should eventually enable boat construction and genuine river crossing. Clues, expe…"},{"id":"F05-US14","title":"Hidden Demo Completion Presentation","status":"Backlog","summary":"After the player reaches the opposite bank through the future hidden crossing, first acknowledge the achievement with the preferred end copy recorded in the Project Context, then offer a secondary wishlist/follow/feedback invitation. Exact Steam buttons, link…"},{"id":"F05-US15","title":"Starting-Island Environmental Mystery","status":"Backlog","summary":"Let exploration raise questions about why the Wanderer and island are here, what happened, and what lies beyond the river. Prefer discoverable clues and world details to exposition dumps. The exact story, protagonist backstory and island history are not yet d…"}]},{"id":"F06","title":"Combat, Enemies & Bosses","description":"Future player-facing feature area for combat encounters, enemies and bosses. The feature belongs in the known product landscape, but the combat model, enemy taxonomy, boss structure and progression rules are intentionally not designed yet.","stories":[]},{"id":"F07","title":"Loot, Gear & Character Progression","description":"XP and player levels are intended to become a major long-term motivation/unlock spine while geography, equipment and exploration remain meaningful.","stories":[{"id":"F07-US01","title":"Player XP and Levels","status":"Backlog","summary":""},{"id":"F07-US02","title":"Level-Based Unlock Progression","status":"Backlog","summary":""},{"id":"F07-US03","title":"XP From Meaningful Play, Not Grinding","status":"Backlog","summary":"---"}]},{"id":"F08","title":"Building & World Creation","description":"","stories":[{"id":"F08-US01","title":"Small Demo Building and Crafting Showcase","status":"Backlog","summary":"The future Steam demo should ideally offer a small but meaningful sample of building/world modification alongside harvesting and crafting. Basic construction or crafting infrastructure may support the hidden boat-progression puzzle while previewing the broade…"}]},{"id":"F09","title":"Travel, Biomes & World Expansion","description":"Future systems for travelling beyond the starting island, expanding into additional biomes and connecting larger regions of the world. Existing principles for natural boundaries, progressive mobility, curiosity and substantial zones remain authoritative; exact travel systems and biome scope are not locked here.","stories":[]},{"id":"F10","title":"Audio, Atmosphere & Music","description":"","stories":[{"id":"F10-US01","title":"Core POC Sound Feedback","status":"Complete","summary":"Dry/wet steps, pickup, chest and drowning cue character are accepted for the first POC audio baseline."},{"id":"F10-US02","title":"Reliable Footstep Playback Across Startup and Focus Changes","status":"Playtesting","summary":"Known issue: footsteps may remain silent at startup or after focus return until another BTR SFX plays. Preloading, persistent footstep playback and an inaudible keepalive did not solve it. Keep open but deferred until new evidence or audio work is prioritized…"}]},{"id":"F11","title":"Maps, Cartography & Zone Structure","description":"","stories":[{"id":"F11-US01","title":"Substantial Zone Scale","status":"Backlog","summary":"About 10 x 10 gameplay screens remains a flexible early large-zone heuristic."},{"id":"F11-US02","title":"Parchment-Style Zone Map","status":"Backlog","summary":""},{"id":"F11-US03","title":"Exploration Reveal on Zone Maps","status":"Backlog","summary":""},{"id":"F11-US04","title":"Simplified World Map","status":"Backlog","summary":""},{"id":"F11-US05","title":"Persistent Exploration Knowledge","status":"Backlog","summary":"---"}]},{"id":"F12","title":"Trading, Economy & Settlements","description":"Future systems for trading, economy and settlements. The project may eventually support multiple ways to obtain resources, value and services, but currencies, markets, settlement simulation and economic balance are intentionally undefined.","stories":[]},{"id":"F13","title":"Day, Night, Rest & Environmental Systems","description":"Future time-of-day, rest and broader environmental systems. The visual project already contains future-facing references to atmosphere and environmental change, but no day/night cycle, rest loop or production environmental simulation is approved for current implementation.","stories":[]},{"id":"F14","title":"Difficulty Modes, Death & Hardcore","description":"Future difficulty, death-consequence and optional hardcore-mode design. Current drowning/respawn behaviour belongs to the POC and does not by itself define the eventual difficulty or death system.","stories":[]},{"id":"F15","title":"Steam, Release & Playtesting Infrastructure","description":"Prepare Beyond the River for external playtesting and eventual Steam release while preserving the project's deliberate mystery. Release infrastructure may include a curated public development trail that rewards unusually curious players without exposing exact internal solutions.","stories":[{"id":"F15-US01","title":"Multi-Resolution and Display Mode Support","status":"Backlog","summary":"Future common Windows resolutions, 16:9/16:10, sensible ultrawide behaviour, windowed/fullscreen/borderless modes, responsive HUD anchoring, authored composition preservation and crisp pixel scaling. Camera zoom remains a separate concern."},{"id":"F15-US02","title":"Curated Public Development Archive / External Discovery Layer","status":"Backlog","summary":"- near Steam release, a curated public page may be deliberately searchable under Beyond the River and Christiaan Leever - the page should look like a plausible development archive/roadmap rather than announcing itself as a puzzle - it may expose high-level cl…"}]},{"id":"F16","title":"AI-Driven Living World & NPC Intelligence","description":"Use AI selectively to make creatures, enemies, companions and NPCs respond to the full context around them instead of relying only on rigid scripted reactions.","stories":[{"id":"F16-US01","title":"Contextual Actor Decision Contract","status":"Backlog","summary":"- Godot supplies structured context and the currently valid actions. - The decision layer returns one valid action plus optional structured reasoning metadata. - Godot validates and executes the result. - Do not build this interface before there is a real act…"},{"id":"F16-US02","title":"Deterministic Local Fallback Behaviour","status":"Backlog","summary":"- Build ordinary local behaviour first. - Timeouts, errors, rate limits or offline play fall back immediately to local logic. - External AI may enrich behaviour but must never be required for basic game continuity."},{"id":"F16-US03","title":"Jev Wolf Experiment","status":"Backlog","summary":"Start only after a basic local wolf behaviour exists."},{"id":"F16-US04","title":"Event-Driven Decision Triggers","status":"Backlog","summary":"Possible triggers include:"},{"id":"F16-US05","title":"Explainable Actor Behaviour","status":"Backlog","summary":"Preferred default is subtle explanation, for example:"},{"id":"F16-US06","title":"Learned Creature Knowledge","status":"Backlog","summary":"A future journal or bestiary may record observations only after the player has actually experienced them, such as wolves being cautious around fire or injured animals retreating more often."},{"id":"F16-US07","title":"Persistent Actor Context & Memory","status":"Backlog","summary":"Potential context includes:"},{"id":"F16-US08","title":"AI-Assisted NPC & Companion Decisions","status":"Backlog","summary":"Examples may include FOLLOW, HELP, WAIT, WARNPLAYER, REFUSE, RETREAT, PROTECTPLAYER or PROTECTSELF."},{"id":"F16-US09","title":"Lore-Constrained Dynamic NPC Dialogue","status":"Backlog","summary":"Dialogue generation may use:"},{"id":"F16-US10","title":"Secure AI Service Integration","status":"Backlog","summary":"A future BTR service may handle:"},{"id":"F16-US11","title":"Living-World Decision Systems","status":"Backlog","summary":"Possible later decisions include:"}]},{"id":"F17","title":"AI-Assisted Development, Autonomous QA & Content Production","description":"Use AI not only to implement individual tasks, but to reduce the repetitive human supervision currently required between implementation, validation, critique and repair.","stories":[{"id":"F17-US01","title":"Trial Builder-Reviewer-Repair Loop","status":"Complete","summary":"For one suitable medium-sized task:"},{"id":"F17-US02","title":"Evidence-First Independent Review","status":"Backlog","summary":"Reviewer input should normally include:"},{"id":"F17-US03","title":"Option B Directed Zone Production","status":"Backlog","summary":"Christiaan should approve the zone direction, not every ordinary tree, rock or grass sprite."},{"id":"F17-US04","title":"Reference Zone as Production Standard","status":"Backlog","summary":"The reference zone should teach later production through:"},{"id":"F17-US05","title":"Option C Autonomous Zone Experiment","status":"Backlog","summary":"Give the system:"},{"id":"F17-US06","title":"Limited Multi-Agent Development Orchestration","status":"Backlog","summary":"Do not build a separate orchestration system merely because it is technically interesting."},{"id":"F17-US07","title":"Human Acceptance Gate","status":"Backlog","summary":"Agents may validate:"}]}];
const STATUS=['Backlog','Ready for development','Developing','Playtesting','Complete'];
const CLASS={'Backlog':'Backlog','Ready for development':'Ready','Developing':'Developing','Playtesting':'Playtesting','Complete':'Complete'};
const LABEL={'Backlog':'Backlog','Ready for development':'Ready','Developing':'Developing','Playtesting':'Playtesting','Complete':'Complete'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='All',query='',expanded=new Set();
const grid=document.getElementById('grid'),filters=document.getElementById('filters'),stats=document.getElementById('stats'),tip=document.getElementById('tooltip'),search=document.getElementById('search'),expandAll=document.getElementById('expandAll'),legend=document.getElementById('legend');

function featureMatches(f){
  const q=query.trim().toLowerCase();
  const statusActive=selected!=='All';
  const titleHit=!q||((f.id+' '+f.title+' '+f.description).toLowerCase().includes(q));
  const matchingStories=f.stories.filter(s=>(!statusActive||s.status===selected)&&(!q||(s.id+' '+s.title+' '+s.summary).toLowerCase().includes(q)));
  if(statusActive) return {show:matchingStories.length>0,stories:matchingStories};
  if(q) return {show:titleHit||matchingStories.length>0,stories:titleHit?f.stories:matchingStories};
  return {show:true,stories:f.stories};
}
function progressHtml(f){
  if(!f.stories.length)return '<div class="progress empty" aria-label="No stories defined"></div>';
  const counts=Object.fromEntries(STATUS.map(s=>[s,0]));f.stories.forEach(s=>counts[s.status]=(counts[s.status]||0)+1);
  return '<div class="progress" aria-label="'+esc(STATUS.filter(s=>counts[s]).map(s=>counts[s]+' '+s).join(', '))+'">'+STATUS.filter(s=>counts[s]).map(s=>'<span class="seg '+CLASS[s]+'" style="width:'+(counts[s]/f.stories.length*100)+'%"></span>').join('')+'</div>';
}
function dotsHtml(f){
  if(!f.stories.length)return '<div class="no-stories">No stories defined yet</div>';
  return '<div class="dots" aria-label="'+f.stories.length+' story status markers">'+f.stories.map(s=>'<span class="dot '+CLASS[s.status]+'" data-tip-title="'+esc(s.id+'. '+s.title)+'" data-tip-status="'+esc(s.status)+'" data-tip-intent="'+esc(s.summary)+'" title="'+esc(s.id+'. '+s.title+' · '+s.status)+'"></span>').join('')+'</div>';
}
function visibleFeatures(){return FEATURES.map(f=>({f,m:featureMatches(f)})).filter(x=>x.m.show)}
function forcedOpen(){return selected!=='All'||query.trim().length>0}
function render(){
  const vis=visibleFeatures();grid.innerHTML='';
  const totalStories=FEATURES.reduce((n,f)=>n+f.stories.length,0);
  const counts=Object.fromEntries(STATUS.map(s=>[s,0]));FEATURES.forEach(f=>f.stories.forEach(s=>counts[s.status]=(counts[s.status]||0)+1));
  let shownStories=0;
  vis.forEach(({f,m})=>{
    shownStories+=m.stories.length;
    const open=forcedOpen()||expanded.has(f.id);
    const sec=document.createElement('section');sec.className='feature'+(open?' open':'');sec.dataset.id=f.id;
    sec.innerHTML='<button class="feature-head" type="button" aria-expanded="'+open+'"><div class="feature-top"><span class="chevron">›</span><span class="fid">'+esc(f.id)+'</span><span class="feature-title">'+esc(f.title)+'</span><span class="feature-count">'+(forcedOpen()&&m.stories.length!==f.stories.length?m.stories.length+'/'+f.stories.length:f.stories.length)+' '+(f.stories.length===1?'story':'stories')+'</span></div>'+progressHtml(f)+dotsHtml(f)+'</button><div class="feature-body" '+(open?'':'hidden')+'><div class="feature-desc">'+esc(f.description)+'</div><ul class="stories"></ul></div>';
    const ul=sec.querySelector('.stories');
    m.stories.forEach(s=>{const li=document.createElement('li');li.className='story';li.dataset.tipTitle=s.id+'. '+s.title;li.dataset.tipStatus=s.status;li.dataset.tipIntent=s.summary;li.innerHTML='<div class="story-name"><span class="sid">'+esc(s.id)+'</span>'+esc(s.title)+'</div><span class="badge '+CLASS[s.status]+'">'+esc(s.status)+'</span>';ul.appendChild(li)});
    sec.querySelector('.feature-head').addEventListener('click',()=>{if(forcedOpen())return;expanded.has(f.id)?expanded.delete(f.id):expanded.add(f.id);render()});
    grid.appendChild(sec);
  });
  if(!vis.length)grid.innerHTML='<div class="empty-state">No features or stories match the current search/filter.</div>';
  stats.innerHTML='<span class="stat"><b>'+FEATURES.length+'</b> features</span><span class="stat"><b>'+shownStories+'</b> of '+totalStories+' stories shown</span>'+STATUS.slice().reverse().map(s=>'<span class="stat">'+esc(LABEL[s])+' <b>'+counts[s]+'</b></span>').join('');
  const allVisibleExpanded=vis.length>0&&!forcedOpen()&&vis.every(({f})=>expanded.has(f.id));
  expandAll.textContent=allVisibleExpanded?'Collapse all':'Expand all';
  expandAll.disabled=forcedOpen()||vis.length===0;
  expandAll.title=forcedOpen()?'Matching features expand automatically while search/filter is active':'';
}
filters.innerHTML=['All',...STATUS].map(s=>'<button class="filter'+(s==='All'?' active':'')+'" data-s="'+esc(s)+'" type="button">'+esc(s==='Ready for development'?'Ready':s)+'</button>').join('');
filters.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;selected=b.dataset.s;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});
search.addEventListener('input',()=>{query=search.value;render()});
expandAll.addEventListener('click',()=>{const vis=visibleFeatures();const all=vis.length&&vis.every(({f})=>expanded.has(f.id));vis.forEach(({f})=>all?expanded.delete(f.id):expanded.add(f.id));render()});
legend.innerHTML=STATUS.map(s=>'<span class="legend-item"><span class="legend-dot" style="background:var(--'+(s==='Ready for development'?'ready':s.toLowerCase())+')"></span>'+esc(LABEL[s])+'</span>').join('');

function showTip(node){
  const title=node.dataset.tipTitle||node.dataset.title;if(!title)return;
  const status=node.dataset.tipStatus||node.dataset.status||'';
  const intent=node.dataset.tipIntent||node.dataset.intent||'';
  tip.innerHTML='<b>'+esc(title)+'</b><span>'+esc(status)+'</span>'+(intent?'<small>Current intent / result</small><div>'+esc(intent)+'</div>':'');
  tip.classList.add('show');
}
document.addEventListener('mouseover',e=>{const n=e.target.closest('.story,.dot');if(n)showTip(n)});
document.addEventListener('mousemove',e=>{if(!tip.classList.contains('show'))return;let x=e.clientX+14,y=e.clientY+14;if(x+tip.offsetWidth>innerWidth-10)x=e.clientX-tip.offsetWidth-14;if(y+tip.offsetHeight>innerHeight-10)y=e.clientY-tip.offsetHeight-14;tip.style.left=Math.max(10,x)+'px';tip.style.top=Math.max(10,y)+'px'});
document.addEventListener('mouseout',e=>{const n=e.target.closest('.story,.dot');if(n&&!n.contains(e.relatedTarget))tip.classList.remove('show')});
render();
</script>
</body>
</html>
